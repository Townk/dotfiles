[package]
name = "recob-probes"
version = "0.0.0"
edition = "2021"
publish = false

# Every dependency here is one the daemon itself will take (docs/recob-protocol-spec.md
# §14), so a version that compiles for a probe is a version known to compile for
# the real thing. The objc2 feature lists in particular are not guessable: a
# missing feature surfaces as a "no method named ..." error far from the cause.
[dependencies]
sha2 = "0.10"
subtle = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSAttributedString"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSArray", "NSPropertyList", "NSValue", "NSDictionary", "NSAttributedString"] }

[profile.release]
opt-level = 2
