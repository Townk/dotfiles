[package]
name = "recobd"
version = "0.1.0"
edition = "2021"
publish = false

# probes/ is its own standalone package (its README explains why it is kept);
# bench/ is zsh. Neither belongs to this workspace's build. wire/ is the
# shared no-platform crate the client binaries are built from (§8).
[workspace]
members = ["wire"]
exclude = ["probes", "bench"]

# Cross-platform dependencies:
#
#   sha2     — the handshake digest (§9.2) and `type_hash` (§14.2). §1.1 measured
#              `shasum` at 14.82 ms per spawn against 0.000282 ms in-process, and
#              that measurement is what chose the implementation language:
#              shelling out would spend the whole per-connection saving on
#              authentication.
#   subtle   — constant-time comparison, which §9.2 makes a requirement rather
#              than an aspiration. zsh has no primitive offering it.
#   rusqlite — the store (§14.2). `bundled` because the daemon must not depend on
#              a system SQLite version; §13's build hook budgets its measured
#              11.4 s cold build.
#
# Everything else stays std: threads for the per-connection task boundary
# (docs/recob-protocol-spec.md §3.4), SO_RCVTIMEO/SO_SNDTIMEO for §5.2's
# timeouts, FromRawFd for §3.2's socket activation, and /dev/urandom for the
# CSPRNG §9.2 names. The only libc call the daemon makes by hand is umask(),
# declared in listen.rs.
[dependencies]
recob-wire = { path = "wire" }
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

# The macOS platform layer (§14.1, §14.2). Versions and feature lists were pinned
# by probes/ first — a missing objc2 feature surfaces as a "no method named ..."
# error far from its cause, so they are not guessable. §14.7: none of this exists
# in the Linux build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSWorkspace",
    "NSRunningApplication",
    "NSAttributedString",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSArray",
    "NSPropertyList",
    "NSValue",
    "NSDictionary",
    "NSURL",
    "NSAttributedString",
] }

[lib]
name = "recobd"
path = "src/lib.rs"

[[bin]]
name = "recobd"
path = "src/main.rs"

[profile.release]
opt-level = 2
