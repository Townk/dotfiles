[tools]
# Programming languages
go = "latest"
java = "latest"
kotlin = "latest"
lua = "5.1"
node = "latest"
python = "latest"
# nightly is pinned next to latest because the bootstrap scripts install it
# explicitly, and every system-update runs `mise prune -y` — which deletes any
# installed version no manifest declares. Unpinned, nightly was removed within
# seconds of being installed and never survived a single update.
rust = [{ version = "latest", components = "rust-analyzer,rust-src,rustfmt,clippy" }, "nightly"]

# Tools
# aws-cli is v2 here, and mise is the only backend that gets us v2 cleanly.
# PyPI ships v1 only (`awscli` 1.x), so the Uvfile can't reach v2 at all; the
# `awscli` brew formula IS v2 but builds against a brew `python@` keg, which
# BREW_MISE_PATTERN exists to keep out of the Cellar. mise's aqua backend
# downloads AWS's own official AWSCLIV2-<version>.pkg and unpacks its payload
# rather than running `installer -pkg` — so we get AWS's self-contained build
# (bundled interpreter, SSO/IAM Identity Center) with no sudo, nothing under
# /usr/local, and no shared Python. Versions track aws/aws-cli git tags.
aws-cli = "latest"
cargo-binstall = "latest"  # prebuilt-binary installer; lets the Cargofile worker skip source builds
# cmake is OS-specific — see conf.d/cmake.toml.tmpl (source build on macOS,
# prebuilt binary elsewhere).
just = "latest"
ninja = "latest"
uv = "latest"

# Note on `luajit`: NeoVim links against LuaJIT (not Lua 5.1), so we still
# need a luajit runtime on the system. The available mise plugin
# (mise-plugins/mise-luaJIT, an asdf compat plugin) fails to build on
# macOS Sequoia / Tahoe because its bundled luarocks 3.13.0 ships a
# rockspec that the modern lua parser rejects. Until that's fixed
# upstream, luajit stays declared in Brewfile.tmpl and is allowlisted in
# system-package-brew's BREW_MISE_ALLOWED.

[settings]
[settings.python]
uv_venv_auto = true
