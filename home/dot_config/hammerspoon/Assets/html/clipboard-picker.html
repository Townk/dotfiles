<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
%%CSS%%
</style>
</head>
<body>
  <div class="panel">
    <div class="search-row">
      <!-- fa-clipboard_list, U+ED7B (verified against symbols.db) -->
      <span class="search-icon">&#xED7B;</span>
      <input id="query" type="text" placeholder="Type to filter entries…" autocomplete="off" spellcheck="false">
    </div>
    <div class="body-row">
      <div class="list-col" id="list"></div>
      <div class="right-col">
        <div class="preview-pane" id="preview"><div class="preview-empty">No preview</div></div>
        <div class="meta-pane" id="meta"></div>
      </div>
    </div>
    <!-- Same footer-key/label pattern as which-key-overlay.html's .footer:
         nf-md-keyboard_return (U+F0311), nf-md-keyboard_esc (U+F12B7),
         nf-md-apple_keyboard_option (U+F0635), all verified against
         symbols.db. Plain "⌃" (U+2303) for Control matches the overlay's
         own ⌃D/⌃U style; Option gets the dedicated glyph above instead of
         the plain "⌥" character. Modifier<->key spacing uses a wrapped
         .hint-mod span + margin, NOT letter-spacing: the two adjacent PUA
         glyphs get shaped into a single cluster by the icon font, so
         letter-spacing had no character boundary to act on (confirmed:
         changing its value had zero visible effect at any size). Key-to-
         label and between-hint spacing come from CSS margin/gap too, not
         literal spaces.

         hintPinLabel and the whole hintAltEnter hint are updated on every
         selection change by updateHints() below (pin/unpin text; ⌥Enter's
         raw/markdown label and visibility, since it's only relevant for
         some kinds). -->
    <div class="hints-row">
      <span><span class="hint-key">&#xF12B7;</span>close</span>
      <span><span class="hint-key"><span class="hint-mod">&#x2303;</span>D</span>delete</span>
      <span><span class="hint-key"><span class="hint-mod">&#x2303;</span>P</span><span id="hintPinLabel">pin</span></span>
      <span><span class="hint-key">&#xF0311;</span>paste</span>
      <span><span class="hint-key"><span class="hint-mod">&#x2303;</span>Y</span>copy</span>
      <span><span class="hint-key"><span class="hint-mod">&#x2303;</span>&#xF0311;</span>keep open</span>
      <span id="hintAltEnter"><span class="hint-key"><span class="hint-mod">&#xF0635;</span>&#xF0311;</span><span id="hintAltEnterLabel">raw</span></span>
    </div>
  </div>
  <script>
  (function () {
    // ITEMS is the full row set from the store (cheap fields only — no
    // blobs); filtering + selection happen entirely client-side against
    // this array. Rich preview content (C) is fetched from Lua on selection
    // change only (see requestPreview / window.__setPreview).
    //
    // hs.json.encode escapes '/' as '\/', so a clip's preview text can never
    // contain a literal "</script" byte sequence here — verified empirically
    // (encode() on a string containing "</b>" yields "<\/b>").
    var ITEMS = %%ITEMS_JSON%%;
    var filtered = ITEMS.slice();
    var selectedIndex = 0;

    // Nerd Font v3 codepoints (same icons as the terminal picker, verified
    // against ~/.local/share/fonts/nerd-font/symbols.db by name — these are
    // 6-hex-digit Plane 16 (Supplementary PUA-B) codepoints, U+10Fxxx, NOT
    // 5-digit U+F0xxx (Plane 15): fa-font, fa-paintbrush (rtf/html),
    // fa-image, fa-folder (files).
    var ICONS = {
      text: '\u{10F031}', rtf: '\u{10F1FC}', html: '\u{10F1FC}',
      image: '\u{10F03E}', files: '\u{10F07B}',
      // Material Design Icons glyphs -- a different icon set within the
      // same Nerd Font, living in the 5-digit Plane 15 range (also
      // verified against symbols.db): nf-md-file_outline,
      // nf-md-folder_outline, nf-md-link_variant.
      file: '\u{F0224}', directory: '\u{F0256}', url: '\u{F0339}'
    };
    // nf-md-file_document_multiple_outline (5-digit Plane 15, verified
    // against symbols.db).
    var MIXED_ICON = '\u{F1518}';

    // Provenance (spec §11): `it.remote` is true when the clip was copied on a
    // different host (its source_host differs from this Mac's). Only remote rows
    // get a "remote" badge — this Mac's own clips are the unmarked default.

    function post(action, extra) {
      var msg = Object.assign({ action: action }, extra || {});
      try { webkit.messageHandlers.clipboardPicker.postMessage(msg); } catch (e) {}
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderList() {
      var listEl = document.getElementById('list');
      var html = '';
      var lastGroup = null;
      for (var i = 0; i < filtered.length; i++) {
        var it = filtered[i];
        if (it.group !== lastGroup) {
          html += '<div class="group-header">' + escapeHtml(it.group) + '</div>';
          lastGroup = it.group;
        }
        var icon = ICONS[it.kind] || MIXED_ICON;
        var sel = (i === selectedIndex) ? ' selected' : '';
        var pinnedClass = it.pinned ? ' pinned' : '';
        // Only remote rows get a badge; local is the unmarked default.
        var originBadge = it.remote ? '<span class="origin-badge">remote</span>' : '';
        html += '<div class="item' + sel + pinnedClass + '" data-idx="' + i + '" data-kind="' + it.kind + '">'
          + '<span class="icon">' + icon + '</span>'
          + '<span class="content">' + escapeHtml(it.preview) + '</span>'
          + originBadge
          + '</div>';
      }
      listEl.innerHTML = html || '<div class="preview-empty" style="padding:8px 12px;">No clips</div>';
      Array.prototype.forEach.call(listEl.querySelectorAll('.item'), function (el) {
        el.addEventListener('mousedown', function (e) {
          e.preventDefault();
          selectedIndex = parseInt(el.getAttribute('data-idx'), 10);
          renderList();
          updateRight();
        });
        el.addEventListener('dblclick', function () { accept(true); });
      });
      scrollSelectedIntoView();
    }

    // Keeps SCROLL_OFFSET items visible between the selected item and
    // whichever edge of the viewport it's approaching (vim's `scrolloff`,
    // applied to this list) -- shrinking near the start/end of the list,
    // since there's nothing further to reveal there.
    var SCROLL_OFFSET = 3;
    function scrollSelectedIntoView() {
      var listEl = document.getElementById('list');
      var items = listEl.querySelectorAll('.item');
      if (items.length === 0) return;
      var selEl = items[selectedIndex];
      if (!selEl) return;

      // el.offsetTop is relative to el.offsetParent -- which, empirically,
      // is NOT #list itself here (verified: every child's offsetTop carried
      // a constant ~50px offset that #list.scrollTop knows nothing about).
      // Comparing the two directly silently skewed every margin check by
      // that constant, in OPPOSITE directions for the top vs. bottom
      // comparison -- exactly the down-scrolls-too-far/up-scrolls-not-far-
      // enough asymmetry this was reported as. getBoundingClientRect() is
      // always screen-relative regardless of the offsetParent chain;
      // subtracting the list's own rect.top and adding back its current
      // scrollTop gives each element's position within #list's scrollable
      // content, independent of both the offsetParent quirk and the
      // current scroll position.
      var listRectTop = listEl.getBoundingClientRect().top;
      function relTop(el) {
        return el.getBoundingClientRect().top - listRectTop + listEl.scrollTop;
      }

      // Within SCROLL_OFFSET items of either edge: snap all the way to
      // that edge (there's nothing further to reveal beyond it, headers
      // included) rather than computing a partial margin.
      if (selectedIndex < SCROLL_OFFSET) {
        listEl.scrollTop = 0;
        return;
      }
      if (selectedIndex >= items.length - SCROLL_OFFSET) {
        var lastEl = items[items.length - 1];
        listEl.scrollTop = Math.max(0, relTop(lastEl) + lastEl.offsetHeight - listEl.clientHeight);
        return;
      }

      // Otherwise, measure the ACTUAL DOM elements SCROLL_OFFSET items
      // away rather than approximating with rowHeight * SCROLL_OFFSET --
      // a group header interspersed within that span has a different
      // height than a normal row, which threw a uniform-height estimate off.
      var aboveEl = items[selectedIndex - SCROLL_OFFSET];
      var belowEl = items[selectedIndex + SCROLL_OFFSET];
      var desiredTop = relTop(aboveEl);
      var desiredBottom = relTop(belowEl) + belowEl.offsetHeight;
      if (desiredTop < listEl.scrollTop) {
        listEl.scrollTop = desiredTop;
      } else if (desiredBottom > listEl.scrollTop + listEl.clientHeight) {
        listEl.scrollTop = desiredBottom - listEl.clientHeight;
      }
    }

    function formatThousands(n) {
      return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // For "image"/"files"/"file" clips, clipboard-history.lua stores `len`
    // as a byte size (total blob size, or the real on-disk file size for
    // "file" -- see len_val in capture_now()) rather than a character
    // count, so it needs KB/MB-style formatting instead of a thousands
    // separator. "directory" has no meaningful size to show at all. "url"
    // has a meaningful character count, but a word count is just noise for
    // a single token.
    var BYTE_SIZED_KINDS = { image: true, files: true, file: true };
    var SIZELESS_KINDS = { directory: true };
    var CHARACTERS_ONLY_KINDS = { url: true };
    var BYTE_UNITS = ['B', 'Kb', 'Mb', 'Gb'];
    function formatBytes(n) {
      var i = 0;
      var val = n;
      while (val >= 1024 && i < BYTE_UNITS.length - 1) {
        val /= 1024;
        i++;
      }
      var rounded = (i === 0) ? Math.round(val) : Math.round(val * 10) / 10;
      return rounded + BYTE_UNITS[i];
    }

    function updateMeta(it) {
      var metaEl = document.getElementById('meta');
      if (!it) { metaEl.innerHTML = ''; return; }
      // valueHtml is trusted, pre-escaped/pre-built HTML (unlike the old
      // version, this is no longer escaped internally) -- callers must
      // escape their own plain-text values themselves.
      function row(label, valueHtml) {
        return '<div class="meta-row"><span class="label">' + label + '</span><span class="value">' + valueHtml + '</span></div>';
      }
      var sizeRow = SIZELESS_KINDS[it.kind] ? ''
        : BYTE_SIZED_KINDS[it.kind] ? row('Bytes:', formatBytes(it.len))
        : CHARACTERS_ONLY_KINDS[it.kind] ? row('Characters:', formatThousands(it.len))
        : row('Characters:', formatThousands(it.len)) + row('Words:', formatThousands(it.words));
      // Origin row only for remote clips (copied on another host); local is the
      // default. Show the source hostname for at-a-glance provenance.
      var originRow = it.remote
        ? row('Origin:', 'remote (' + escapeHtml(it.sourceHost) + ')')
        : '';
      metaEl.innerHTML = '<div class="meta-title">Information</div>'
        + row('Source:', '<span class="source-icon" id="sourceIcon"></span>' + escapeHtml(it.app))
        + row('Content Type:', escapeHtml(it.kindLabel))
        + originRow
        + sizeRow
        // Populated on demand by __setPreview below, once/if the fetched
        // preview turns out to be an image -- collapses to nothing (see
        // .meta-row:empty in the CSS) for every other kind.
        + '<div class="meta-row" id="dimensionsRow"></div>'
        + row('Copied:', escapeHtml(it.age));
      // Real app icons are fetched on demand (not bulk-loaded with ITEMS) --
      // see fetch_app_icon in clipboard-picker.lua.
      post('icon', { id: it.id, bundleId: it.bundleId, appName: it.app });
    }

    // Lua -> JS: apply a fetched app icon, but only if the item it was for
    // is STILL the one currently shown (guards against a stale response
    // landing after the user has already moved to a different item).
    window.__setSourceIcon = function (payload) {
      var current = filtered[selectedIndex];
      if (!current || current.id !== payload.id || !payload.dataUri) return;
      var iconEl = document.getElementById('sourceIcon');
      if (iconEl) iconEl.innerHTML = '<img src="' + payload.dataUri + '">';
    };

    // ⌥Enter only does something distinct for these kinds (see
    // restore_plain_by_id in clipboard-history.lua) -- html/rtf strip
    // styling down to "raw" text, the rest linkify as "markdown". Every
    // other kind (text, files, mixed) already pastes as plain text via a
    // plain Enter, so the hint is hidden rather than shown as a no-op.
    var ALT_ENTER_LABELS = {
      html: 'raw', rtf: 'raw',
      image: 'markdown', file: 'markdown', directory: 'markdown', url: 'markdown',
    };
    function updateHints(it) {
      var pinLabel = document.getElementById('hintPinLabel');
      if (pinLabel) pinLabel.textContent = (it && it.pinned) ? 'unpin' : 'pin';

      var altEnterHint = document.getElementById('hintAltEnter');
      var altEnterLabel = document.getElementById('hintAltEnterLabel');
      var label = it && ALT_ENTER_LABELS[it.kind];
      if (altEnterHint) altEnterHint.style.display = label ? '' : 'none';
      if (label && altEnterLabel) altEnterLabel.textContent = label;
    }

    function updateRight() {
      var it = filtered[selectedIndex];
      updateMeta(it);
      updateHints(it);
      var previewEl = document.getElementById('preview');
      if (!it) { previewEl.innerHTML = '<div class="preview-empty">No preview</div>'; return; }
      previewEl.innerHTML = '<div class="preview-empty">Loading…</div>';
      post('preview', { id: it.id, kind: it.kind });
    }

    // Lua -> JS callbacks (invoked via webview:evaluateJavaScript).
    window.__setPreview = function (content) {
      var previewEl = document.getElementById('preview');
      // Guards the Dimensions injection below against a stale response
      // landing after the user has already moved to a different item (the
      // preview pane render further down predates this check and isn't
      // guarded the same way -- not touching that pre-existing behavior).
      var current = filtered[selectedIndex];
      var dimEl = document.getElementById('dimensionsRow');
      if (dimEl) {
        dimEl.innerHTML = (content && current && content.id === current.id
          && content.kind === 'image' && content.width && content.height)
          ? '<span class="label">Dimensions:</span><span class="value">' + content.width + '\u00d7' + content.height + '</span>'
          : '';
      }
      if (!content) { previewEl.innerHTML = '<div class="preview-empty">No preview</div>'; return; }
      if (content.kind === 'html') {
        // allow-same-origin (but NOT allow-scripts) lets the load handler
        // below read the iframe's computed styles -- still fully blocks any
        // embedded <script> in the clip from ever executing.
        previewEl.innerHTML = '<iframe sandbox="allow-same-origin" srcdoc="' + escapeHtml(content.html) + '"></iframe>';
        var frame = previewEl.querySelector('iframe');
        frame.addEventListener('load', function () {
          try {
            var doc = frame.contentDocument;
            function isTransparentBg(style) {
              return style.backgroundColor === 'rgba(0, 0, 0, 0)' && style.backgroundImage === 'none';
            }
            var htmlTransparent = isTransparentBg(getComputedStyle(doc.documentElement));
            var bodyTransparent = !doc.body || isTransparentBg(getComputedStyle(doc.body));
            if (htmlTransparent && bodyTransparent) {
              // No explicit background anywhere -- let the dark panel show
              // through instead of the CSS default white/invert treatment
              // (see clipboard-picker.css's .no-bg rule), and give
              // otherwise-uncolored text the same gray .panel itself uses.
              // Normal (non-!important) inheritance: any text the clip DID
              // color explicitly keeps its own color untouched.
              frame.classList.add('no-bg');
              doc.documentElement.style.color = 'rgba(224, 224, 224, 1)';
            }
          } catch (e) {}
        });
      } else if (content.kind === 'image') {
        previewEl.innerHTML = '<img src="' + content.dataUri + '">';
      } else {
        previewEl.innerHTML = '<pre>' + escapeHtml(content.text) + '</pre>';
      }
    };

    // payload: { id, pinned, group } -- group is recomputed Lua-side (via
    // the same group_label() the initial query uses) since pinning moves a
    // clip into/out of the "Pinned" group and the client has no way to
    // recompute that itself from a pre-formatted group string alone.
    window.__setPinned = function (payload) {
      for (var i = 0; i < ITEMS.length; i++) {
        if (ITEMS[i].id === payload.id) { ITEMS[i].pinned = payload.pinned; ITEMS[i].group = payload.group; }
      }
      applyFilter(document.getElementById('query').value, true);
      if (payload.pinned) {
        // The Pinned group is always first -- reveal its header the same
        // way selecting the very first item already does. Unpinning needs
        // no equivalent: applyFilter above re-selects the same clip at its
        // new (unpinned) position, and scrollSelectedIntoView() already
        // brings whatever's selected into view.
        document.getElementById('list').scrollTop = 0;
      }
    };

    // nextSelectId: which clip to select once `id` is gone (computed by the
    // caller BEFORE removal, from the about-to-be-stale `filtered` array) --
    // avoids the old behavior of always snapping back to index 0, since the
    // just-removed id can never re-match in the post-removal list.
    window.__removeItem = function (id, nextSelectId) {
      ITEMS = ITEMS.filter(function (it) { return it.id !== id; });
      applyFilter(document.getElementById('query').value, false, nextSelectId);
    };

    window.__focusInput = function () {
      var q = document.getElementById('query');
      q.focus();
      q.select();
    };

    function applyFilter(q, keepSelection, selectId) {
      q = (q || '').toLowerCase();
      var prevId = selectId != null ? selectId
        : (keepSelection && filtered[selectedIndex] ? filtered[selectedIndex].id : null);
      // Pinned first, then most recent first -- the same total order as the
      // store's own `ORDER BY pinned DESC, last_ts DESC`.
      //
      // Sorting on `ts` rather than falling back to ITEMS order is what makes
      // an UNPIN put the clip back where it belongs. ITEMS arrives already
      // pinned-hoisted, so a clip that was pinned when the picker opened sits
      // near the front of it; with a stable sort and no tiebreaker, clearing
      // its `pinned` flag left it stranded at the top of the unpinned block
      // instead of dropping back to its place in the timeline.
      var base = ITEMS.slice().sort(function (a, b) {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return b.ts - a.ts;
      });
      filtered = q === '' ? base : base.filter(function (it) {
        return it.preview.toLowerCase().indexOf(q) !== -1
          || (it.app || '').toLowerCase().indexOf(q) !== -1;
      });
      if (prevId != null) {
        var idx = -1;
        for (var i = 0; i < filtered.length; i++) { if (filtered[i].id === prevId) { idx = i; break; } }
        selectedIndex = idx >= 0 ? idx : 0;
      } else {
        selectedIndex = 0;
      }
      renderList();
      updateRight();
    }

    function move(delta) {
      if (filtered.length === 0) return;
      selectedIndex = Math.max(0, Math.min(filtered.length - 1, selectedIndex + delta));
      renderList();
      updateRight();
    }

    function pageMove(dir) {
      var listEl = document.getElementById('list');
      var approxRowHeight = 24;
      var visible = Math.max(1, Math.floor(listEl.clientHeight / approxRowHeight));
      move(dir * visible);
    }

    function accept(dismiss) {
      var it = filtered[selectedIndex];
      if (!it) return;
      post('accept', { id: it.id, dismiss: dismiss });
    }

    // Alt+Enter: paste with RTF/HTML styling stripped (restore_plain_by_id
    // on the Lua side), always dismissing -- same as a plain Enter accept.
    function acceptPlain() {
      var it = filtered[selectedIndex];
      if (!it) return;
      post('acceptPlain', { id: it.id });
    }

    // Ctrl+Y: restore the clip to the clipboard WITH its register type and
    // dismiss WITHOUT pasting (no auto-Cmd-V) -- so you paste it yourself, e.g.
    // `p` in nvim to keep a block clip's shape. Unlike Enter, which restores
    // AND pastes charwise into whatever app is focused.
    function copyClip() {
      var it = filtered[selectedIndex];
      if (!it) return;
      post('copy', { id: it.id });
    }

    function del() {
      var it = filtered[selectedIndex];
      if (!it) return;
      // Select the next item first (or the previous one, if there is no
      // next), computed against the about-to-be-stale `filtered` array --
      // otherwise the deleted id can never re-match afterward and
      // selection would fall back to index 0 every time.
      var next = filtered[selectedIndex + 1] || filtered[selectedIndex - 1];
      post('delete', { id: it.id });
      window.__removeItem(it.id, next ? next.id : null);
    }

    function pin() {
      var it = filtered[selectedIndex];
      if (!it) return;
      post('pin', { id: it.id }); // optimistic update arrives via __setPinned
    }

    document.getElementById('query').addEventListener('input', function (e) {
      applyFilter(e.target.value, false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); accept(false); return; }
      if (e.key === 'Enter' && e.altKey) { e.preventDefault(); acceptPlain(); return; }
      if (e.key === 'Enter') { e.preventDefault(); accept(true); return; }
      if (e.key === 'ArrowDown' || (e.ctrlKey && e.key === 'j')) { e.preventDefault(); move(1); return; }
      if (e.key === 'ArrowUp' || (e.ctrlKey && e.key === 'k')) { e.preventDefault(); move(-1); return; }
      if (e.ctrlKey && e.key === 'f') { e.preventDefault(); pageMove(1); return; }
      if (e.ctrlKey && e.key === 'b') { e.preventDefault(); pageMove(-1); return; }
      // vim's gg/G, which need a modifier here because a bare letter goes to
      // the search field. Direction comes off shiftKey rather than the letter's
      // case so Caps Lock can't invert it. A delta of the whole list length is
      // always enough to hit either end -- move() clamps, re-renders and
      // scrolls the selection back into view.
      if (e.ctrlKey && (e.key === 'g' || e.key === 'G')) {
        e.preventDefault();
        move(e.shiftKey ? filtered.length : -filtered.length);
        return;
      }
      if (e.ctrlKey && e.key === 'y') { e.preventDefault(); copyClip(); return; }
      if (e.ctrlKey && e.key === 'd') { e.preventDefault(); del(); return; }
      if (e.ctrlKey && e.key === 'p') { e.preventDefault(); pin(); return; }
      if (e.key === 'Escape') { e.preventDefault(); post('dismiss'); return; }
    });

    // The icon font (@font-face, a local file:// load) is asynchronous. If
    // the very first list render happens before it's ready, WebKit paints a
    // fallback glyph for those rows and does not reliably repaint them once
    // the font arrives (font-display: block above avoids painting a WRONG
    // glyph, but an early render can still race the font and end up blank
    // instead of correct). Gate the first render on document.fonts.ready so
    // every row's icon is painted only once the font is actually available;
    // subsequent re-renders (typing, delete/pin) happen well after this
    // resolves and are unaffected either way.
    function firstRender() {
      applyFilter('', false);
      window.__focusInput();
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(firstRender, firstRender);
    } else {
      firstRender();
    }
  })();
  </script>
</body>
</html>
