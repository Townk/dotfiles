<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
%%CSS%%
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="toolbar">
      <input class="search-input" id="search" type="text" autocomplete="off" spellcheck="false"
        placeholder="Search title, author, narrator, series…">
      <span class="chip" id="chipShowLibrary" data-active="false">Show library</span>
      <span class="chip" id="chipBrowse">Browse&hellip;</span>
    </div>
    <!-- The source bar. Always present, never conditional markup: which
         library the operator is looking at is the one fact that must not be
         inferable only from the rows themselves — a mis-picked folder that
         surfaces 400 books has to be readable BEFORE any of them is
         selected. renderSource() fills it. -->
    <div class="source" id="source" data-kind="library"></div>
    <div class="rows" id="rows"></div>
    <div class="footer">
      <span id="summary"></span>
      <span class="spacer"></span>
      <span class="btn-ghost" id="btnDismiss">Not now</span>
      <span class="btn-primary disabled" id="btnStart">Start Rip</span>
    </div>
  </div>

  <!-- Diagnostic trap, deliberately its OWN script element and first on the
       page — same reason rip-session.html and clipboard-picker.html carry
       one: a parse error in the main block below aborts that block whole,
       silently, and WebKit reports it nowhere Hammerspoon can see. -->
  <script>
    window.__lastError = null;
    window.onerror = function (msg, src, line, col) {
      window.__lastError = String(msg) + " @" + String(line) + ":" + String(col);
    };
  </script>
  <script>
  (function () {
    'use strict';

    // The panel as library-dialog.lua built it (library_payload, embedded
    // through json_for_script — see rip-session.html for why every '<' is
    // <-escaped there; same rule applies here).
    var PAYLOAD = %%LIBRARY_JSON%%;

    //----------------------------------------------------------------------
    // Inline SVG icons. No Nerd Font / @font-face anywhere in this panel
    // (same reason as rip-session.html): every glyph below is markup.
    //----------------------------------------------------------------------
    var SVG_BOOK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 22Z"></path><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"></path></svg>';

    // "liberated, never pushed" detail line (rip-session.html's SVG_CHECK_SM,
    // same 12x12 sizing, a warning triangle instead of a check — this is a
    // divergence to flag, not a state to celebrate).
    var SVG_WARN_SM = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgb(250,179,135)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

    // "Audible Plus" detail lines. A padlock rather than the warning
    // triangle: this is not a divergence between two systems (what
    // SVG_WARN_SM marks) but a statement about what you are allowed to
    // keep. Red for a lapsed licence — the book is already unreachable —
    // and the same 12x12 sizing as SVG_WARN_SM so the detail lines align.
    var SVG_LOCK_SM = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgb(243,139,168)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

    // The same padlock in --peach: still borrowed, still rippable, and the
    // line that goes with it is a call to action rather than an epitaph.
    var SVG_LOCK_SM_WARN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgb(250,179,135)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

    //----------------------------------------------------------------------
    // State — every row, plus the derived sets/flags the UI needs.
    //----------------------------------------------------------------------
    var ROWS = [];            // provider rows, as given
    var SELECTED = new Set(); // row ids the operator marked Rip
    var SERVER = new Set();   // "<Author>/<Title>" paths cantina already holds
    // Tri-state guard for SERVER: false until __setServerLibrary's fetch
    // actually lands. SERVER reads empty in THREE different situations —
    // cantina genuinely has nothing, --server-library failed (mini
    // offline, VPN down), or the fetch just hasn't landed yet (routine:
    // the rows fetch and the server fetch run concurrently by design,
    // library.setRows/setServerLibrary populate the panel additively in
    // whichever order they land) — and only the middle one, "we asked and
    // it failed", is even close to a positive claim, which still is NOT
    // "cantina lacks this book". Gates neverPushedHtml below: without it,
    // every liberated row would flash (or permanently assert, on a
    // --server-library failure) "never pushed" before/without the server
    // answer ever confirming the book is actually missing (2026-08-23
    // re-review finding). The hide filter above is unaffected on purpose —
    // "unknown" already means "show everything" there, which is correct;
    // this only stops the panel from making a positive claim it can't
    // support.
    var SERVER_KNOWN = false;
    var SERVER_EDITIONS = [];       // { author, title, published, path } rows cantina holds with a known published date
    // Same tri-state discipline as SERVER_KNOWN above: false until
    // __setServerEditions's fetch actually lands, so an absent or failed
    // --server-editions run never asserts an edition claim the panel cannot
    // support — it just renders nothing (otherEditionHtml below).
    var SERVER_EDITIONS_KNOWN = false;
    var FOCUS_ID = null;      // keyboard-focused row id (see moveFocus)
    var SHOW_LIBRARY = false; // the "show library" chip
    var QUERY = "";           // debounced search text
    var LOADING = false;
    // The CATALOGUE provider — the thing that owns an Audible-side row.
    // Normalised through catalogueProvider() because "folder" is a SOURCE,
    // never a catalogue: M.browse opening the panel cold used to seed
    // PROVIDER = "folder" from its payload, and since only __setLibrary ever
    // rewrites PROVIDER, the way back to the Audible library then posted
    // real ASINs under provider "folder" — rip::ab_worker would hand them to
    // rip-provider-folder as source DIRECTORIES. Latent while `ripper.library`
    // was the only entry point; the Finder Quick Action browsing cold is what
    // arms it.
    var PROVIDER = catalogueProvider(PAYLOAD && PAYLOAD.provider);

    // Which library is on screen. `library` = Libation's Audible catalogue
    // (the panel's original and only source); `folder` = a local tree the
    // operator browsed to, listed by rip-provider-folder through
    // `rip-audiobook --browse <root>`.
    //
    // This is a MODE, not a filter: a folder row's identity is DERIVED
    // (from tags, the directory structure, or the filename), so files mode
    // renders it as two editable fields plus a provenance marker, and it
    // suppresses the Audible-only marks that would otherwise misfire on it
    // (see neverPushedHtml).
    var SOURCE = { kind: "library", root: "" };

    // What __setSource displaced, so a FAILED browse can put it back.
    // Switching source clears the rows (showing one library's books under
    // another's name would be a lie), but a fetch that never lands must not
    // cost the operator the library they were already looking at — the
    // failure path calls __sourceFailed, which restores this wholesale.
    var PREV_SOURCE = null;

    function isFiles() { return SOURCE.kind === "folder"; }

    // Shape whatever crossed the bridge into exactly the two keys the
    // renderer reads. Anything that is not the literal "folder" is the
    // Audible library — an unrecognised kind must not put the panel into a
    // mode with editable identities and no root to name.
    function sourceOf(s) {
      s = s || {};
      return {
        kind: s.kind === "folder" ? "folder" : "library",
        root: String(s.root == null ? "" : s.root)
      };
    }

    // The plan's `provider` follows the SOURCE, not the payload: it is what
    // rip::ab_worker dispatches acquire on, and a browsed book has to be
    // acquired by rip-provider-folder no matter which provider opened the
    // panel. Derived at post time rather than stored, so nothing has to
    // remember to put PROVIDER back when the operator switches source back.
    function providerName() { return isFiles() ? "folder" : PROVIDER; }

    // "folder" is a source, not a catalogue. Anything else non-empty is
    // taken at its word (a future second store); an absent or folder-ish
    // value falls back to the only catalogue that exists today.
    function catalogueProvider(p) {
      return (typeof p === "string" && p !== "" && p !== "folder") ? p : "libation";
    }

    // How the folder provider's `derived_from` reads on screen. Not a
    // decoration: the operator has to be able to scan for the WEAK guesses
    // and leave the strong ones alone, so each source is named plainly
    // rather than collapsed into one "derived" badge. An unknown value
    // (a future provider) falls through and prints itself.
    var DERIVED_LABEL = {
      tags: "from the audio tags",
      path: "from the folder names",
      filename: "from the filename"
    };

    // Posts the raw object, NOT JSON.stringify'd — WebKit bridges a plain JS
    // object/array/string/number straight to a Lua table/string/number, and
    // library-dialog.lua's handle_message(msg.body) reads it as a table
    // directly. Same mechanic as rip-session.html's post() and
    // clipboard-picker.html's, both of which post the bare object too.
    function post(msg) {
      try { window.webkit.messageHandlers.ripLibrary.postMessage(msg); } catch (e) {}
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // hs.json.encode cannot distinguish an empty Lua LIST from an empty Lua
    // MAP and emits "{}" for both (documented at length in rip-session.html
    // / session-dialog.lua's session_payload comment) — so any array that
    // COULD be empty on the Lua side must be read back through this guard,
    // never trusted bare. Applied both to the row list itself and to each
    // row's authors/narrators, which a provider row is free to leave empty.
    function arr(v) { return Array.isArray(v) ? v : []; }

    // Mirrors rip::_author_norm (home/dot_local/lib/rip.zsh) exactly: lowercase,
    // strip everything outside a-z0-9. Used to compare a row's author/title
    // against SERVER_EDITIONS without either side's punctuation/casing noise
    // producing a false miss.
    function norm(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Normalize one provider row. This object is BOTH what the DOM renders
    // AND — verbatim, per row the operator marks Rip — what start() posts
    // back as the plan payload that rip::ab_worker merges into the meta
    // index (plan items win) and rip::_book_meta_for reads to write the
    // once-only, permanent .fleet-book.json sidecar. A prior version built
    // this as a DISPLAY-ONLY whitelist of 11 keys, which silently dropped
    // `ids` (audible.asin), `provider`, `provider_version`, `format`,
    // `language`, `abridged` and `acquired_utc` from every book queued
    // through this panel — the sidecar recorded "ids": {} and "provider":
    // "unknown" for a book that demonstrably came from Libation, and
    // because staging is deleted after a verified push and the merge rule
    // never lets a later write overwrite an already-recorded provider, that
    // falsehood was permanent (2026-08-23 review finding).
    //
    // Fix: copy every OWN key of the incoming row first, so unknown/future
    // provider keys survive untouched, then override ONLY what the DOM
    // itself requires a specific shape for: id as a string (Set membership
    // and dataset round-trips never mismatch on JS's number-vs-string JSON
    // quirks — the same boundary lesson as session-dialog.lua's title_no)
    // and authors/narrators forced through arr() (the empty-LIST-vs-empty-
    // MAP ambiguity hs.json.encode has crossing the Lua bridge — see arr()
    // above). Nothing else is coerced: a null/absent subtitle or
    // duration_s now reaches the payload exactly as the provider sent it,
    // instead of the invented '' / 0 the old whitelist forced on it (both
    // of which also ended up in the sidecar for no reason). Every display
    // call site below already guards optional fields with `||`/truthiness
    // (bylineHtml, metaHtml, hms), so this is safe for rendering too.
    //
    // The copy loop is why the folder provider's `derived_from` needs no
    // line of its own here, and it must STAY that way: a per-key copy
    // written as `if (r.derived_from) out.derived_from = ...` would carry
    // "tags"/"path"/"filename" and silently drop the empty string — a row
    // whose provenance is genuinely unknown would then be indistinguishable
    // from one whose provenance was never reported. Copy every own key,
    // falsy values included, and override only the two shapes the DOM
    // requires.
    function normalizeRow(r) {
      r = r || {};
      var out = {};
      for (var k in r) {
        if (Object.prototype.hasOwnProperty.call(r, k)) out[k] = r[k];
      }
      out.id = String(r.id);
      out.authors = arr(r.authors);
      out.narrators = arr(r.narrators);
      // The PROVIDER's composed path, kept before any edit can touch it.
      // applyEdit recomposes `path` from authors[0] + title, which is the
      // folder provider's own rule (path = author + "/" + title) but NOT
      // libation's: that provider composes the path component as
      // "Title: Subtitle" while `title` stays bare, so recomposing a library
      // row from its fields DROPS the subtitle (review finding, 2026-08-26).
      // Library rows are not identity-editable — only their Edition is — so
      // for them the path the provider composed IS the base, and the edition
      // suffix hangs off that. Captured here, once, at the same place `id`
      // and the two arrays are normalized.
      out.base_path = r.path;

      // Canonicalize the author's DISPLAY spelling THE MOMENT THE ROW IS
      // BUILT — not only on blur (authorDisplay's own rule, below). Without
      // this, a row the operator never clicked into kept the provider's raw
      // spelling all the way into isStored's raw `SERVER.has(r.path)`
      // compare, the composed path, and the posted plan: a sweep can rename
      // a whole shelf on cantina from "J.K. Rowling" to "J. K. Rowling"
      // while the folder provider goes on deriving "J.K. Rowling" from the
      // file's own tags, and an untouched row's `path` could then never
      // match the server's — isStored stayed false and a book already on
      // cantina rendered as rippable (2026-08-26 followup finding).
      //
      // Every author is normalized for display — bylineHtml joins the whole
      // array, and a co-author left in the raw form would be the same
      // inconsistency this fix exists to remove — but only authors[0] drives
      // path composition, matching applyEdit's own rule below exactly.
      out.authors = out.authors.map(authorDisplay);

      // FILES mode composes `path` FROM authors[0] + title — the identical
      // rule applyEdit encodes (`isFiles() ? (a === '' ? t : a + '/' + t) :
      // ...`) — so an unedited row's path has to agree with the same
      // canonical author or the compare above can never fire. This is a
      // faithful re-run of the provider's OWN composition rule (rip-
      // provider-folder's cmd_list composes path = author + "/" + title the
      // same way), so it is a no-op whenever authorDisplay changed nothing.
      //
      // LIBRARY mode's `path` is the provider's own composed string, which
      // can carry a subtitle `title` does not (applyEdit's comment above:
      // libation composes "Title: Subtitle" while `title` stays bare) — so
      // it is never recomposed here, exactly as applyEdit never recomposes
      // it on edit. base_path above already preserved the untouched
      // original for both modes.
      if (isFiles()) {
        var a0 = out.authors.length ? String(out.authors[0] == null ? '' : out.authors[0]) : '';
        var t0 = String(out.title == null ? '' : out.title);
        out.path = a0 === '' ? t0 : a0 + '/' + t0;
      }
      return out;
    }

    function normalizeRows(rows) { return arr(rows).map(normalizeRow); }

    // A row that dropped out of ROWS (a refresh no longer includes it) must
    // drop out of SELECTED too — otherwise renderFooter()'s SELECTED.size
    // overcounts what start() will actually send (it filters against the
    // CURRENT ROWS). Called from every entry point that replaces ROWS.
    function purgeStaleSelection() {
      var ids = {};
      for (var i = 0; i < ROWS.length; i++) ids[ROWS[i].id] = true;
      Array.from(SELECTED).forEach(function (id) { if (!ids[id]) SELECTED.delete(id); });
    }

    //----------------------------------------------------------------------
    // Lua -> JS entry points
    //----------------------------------------------------------------------
    // Additive repaint of an open panel: rows arriving here always end the
    // loading state (library-dialog.lua's preview "loading" fixture relies
    // on exactly this — open with loading:true and no rows, then 2.5s later
    // deliver the real rows through this same entry point).
    window.__setRows = function (rows, sourceKind) {
      // A delivery belongs to the source that ASKED for it. Switching source
      // does not un-ask a fetch already walking a large tree, and the two
      // row-producing fetches are separately anchored, so each one\'s own
      // identity guard (`stale`) only ever defends it against its OWN
      // successor — never against the other source\'s answer landing after
      // the switch. Without this tag: browse a big folder, click "Audible
      // library" while it is still scanning, and the browse completes rc=0
      // into a panel that is now in library mode — 400 folder rows with no
      // edit fields, no derived_from marker, posted under the libation
      // provider. The mirror is worse: Audible rows in files mode post real
      // ASINs as provider "folder", and rip::ab_worker hands them to
      // rip-provider-folder as source directories.
      //
      // ripper/init.lua also terminates the other row fetch on every switch;
      // this is the half that cannot race. terminate() is only SIGTERM, so a
      // fetch that already finished writing still delivers rc = 0 — the very
      // case the "a terminated task essentially never lands here with rc==0"
      // note upstream admits it cannot rule out.
      //
      // An UNTAGGED delivery is accepted: that is a caller with no source
      // opinion (the preview harness), not a stale one.
      if (typeof sourceKind === "string" && sourceKind !== SOURCE.kind) return;
      ROWS = normalizeRows(rows);
      LOADING = false;
      purgeStaleSelection();
      render();
    };

    window.__setServerLibrary = function (paths) {
      SERVER = new Set(arr(paths));
      SERVER_KNOWN = true;
      render();
    };

    // The "show library" chip's own handler is a DOM listener, which the node
    // harness cannot dispatch — so without this seam the stored-row block is
    // unreachable by any automated check, and it only takes effect when the
    // chip is ON (with it off, a stored row is filtered out of the list
    // entirely and cannot be selected in the first place). Named for what it
    // is rather than smuggled in as a bridge call nothing makes.
    window.__setShowLibrary = function (on) {
      SHOW_LIBRARY = !!on;
      render();
    };

    window.__setServerEditions = function (list) {
      SERVER_EDITIONS = arr(list);
      SERVER_EDITIONS_KNOWN = true;
      render();
    };

    // Lua -> JS: switch which library the panel is showing, and enter the
    // loading state for the fetch that is about to land (library-dialog.lua's
    // M.setSource, called by ripper/init.lua's M.browse and by the "Audible
    // library" way back).
    //
    // Rows/selection are CLEARED, not carried over: they belong to the
    // source being left, and a folder row and an Audible row are not
    // interchangeable (different ids, different provider, a derived
    // identity vs a catalogued one). They are stashed in PREV_SOURCE first
    // so __sourceFailed can undo the whole switch — a fetch that fails is
    // not a reason to lose the library already on screen.
    window.__setSource = function (src) {
      src = src || {};
      PREV_SOURCE = { source: SOURCE, rows: ROWS, selected: SELECTED };
      SOURCE = sourceOf(src);
      ROWS = [];
      SELECTED = new Set();
      FOCUS_ID = null;
      LOADING = true;
      render();
    };

    // Lua -> JS: the fetch a source switch was waiting on failed. Put back
    // exactly what __setSource displaced and end the loading state —
    // WITHOUT this the panel would either sit on "loading…" forever
    // (LOADING is only ever cleared by a row delivery) or, if it cleared
    // the state alone, read "nothing to show" over a library that is still
    // perfectly good.
    //
    // NOT browse-specific, which is why it is not called __browseFailed:
    // the way BACK loses just as much. Browse 400 books, mark 40, click
    // "Audible library", and have LibationCli be mid-update — the browsed
    // list and all 40 marks are sitting in PREV_SOURCE, and the old
    // setRows({}) failure path would have painted "nothing to show" over
    // them with no way back short of dismissing.
    //
    // With no switch pending (PREV_SOURCE null — a cold `ripper.library`
    // whose first fetch failed) this degrades to exactly what setRows({})
    // did: clear loading, fall through to "nothing to show".
    window.__sourceFailed = function () {
      if (PREV_SOURCE) {
        SOURCE = PREV_SOURCE.source;
        ROWS = PREV_SOURCE.rows;
        SELECTED = PREV_SOURCE.selected;
        PREV_SOURCE = null;
      }
      LOADING = false;
      render();
    };

    // Lua -> JS: replace the WHOLE payload in place (library-dialog.lua's
    // M.show re-render branch, fired when the panel is already open).
    // Deliberately distinct from __setRows: a fresh `data` from the caller
    // carries loading/provider too, and those must survive a second show()
    // exactly as they did the first time (mirrors rip-session.html's
    // window.__setSession, which is also a full reset for the same reason).
    window.__setLibrary = function (data) {
      if (!data) return;
      LOADING = !!data.loading;
      if (data.provider) PROVIDER = catalogueProvider(data.provider);
      SOURCE = sourceOf(data.source);
      PREV_SOURCE = null;
      ROWS = normalizeRows(data.rows);
      purgeStaleSelection();
      render();
    };

    //----------------------------------------------------------------------
    // Derived view
    //----------------------------------------------------------------------
    function visible() {
      var q = QUERY.trim().toLowerCase();
      return ROWS.filter(function (r) {
        // NFC-sensitive by design, not by oversight: r.path is composed by
        // the provider from JSON that is already NFC, and SERVER's entries
        // come off the server's `find` listing, which rip-push's --iconv
        // makes NFC-canonical before it ever lands there (rip.zsh). Both
        // sides are guaranteed NFC at the source — do not "simplify" this
        // into a normalizing/case-folding compare; a decomposed name on
        // either side would silently re-offer a book the operator owns.
        if (!SHOW_LIBRARY && SERVER.has(r.path)) return false;
        if (!q) return true;
        return (r.title + " " + (r.subtitle || "") + " " + r.authors.join(" ") +
                " " + r.narrators.join(" ") + " " + (r.series || "")).toLowerCase().indexOf(q) !== -1;
      });
    }

    function hms(s) {
      if (!s) return "";
      var h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
      return h ? (h + "h " + m + "m") : (m + "m");
    }

    //----------------------------------------------------------------------
    // Render
    //----------------------------------------------------------------------
    function bylineHtml(r) {
      var bits = [];
      if (r.authors.length) bits.push(r.authors.join(", "));
      if (r.narrators.length) bits.push("read by " + r.narrators.join(", "));
      return esc(bits.join(" · "));
    }

    function metaHtml(r) {
      var bits = [];
      if (r.series) bits.push(r.series + (r.series_position ? " #" + r.series_position : ""));
      var d = hms(r.duration_s);
      if (d) bits.push(d);
      return esc(bits.join(" · "));
    }

    // "liberated, never pushed": the spec's own name for the divergence
    // between Libation's acquired flag and cantina's server set — a title
    // Libation calls liberated (acquired === true, strict: a truthy
    // non-boolean acquired_utc-ish value must not light this up) that
    // cantina does not hold (r.path absent from SERVER) is exactly a push
    // that never happened, and it stays visible with this line rather than
    // silently blending into an ordinary not-yet-ripped row.
    function neverPushedHtml(r, inLibrary) {
      // Tri-state: only assert the claim once the server fetch has
      // actually landed (SERVER_KNOWN — see its declaration above). While
      // it hasn't, SERVER being empty says nothing about whether cantina
      // lacks this book, so render nothing rather than a false positive.
      //
      // Never in files mode. "Liberated" is Libation's word for a title
      // decrypted out of Audible, and this line reports a divergence
      // between Audible and cantina — a browsed row has no Audible side to
      // diverge from. It also carries acquired:true unconditionally (the
      // bytes are on this disk), so without this gate the warning would
      // fire on EVERY browsed book cantina does not already hold, which is
      // most of them: pure noise on exactly the rows being selected.
      if (isFiles()) return '';
      if (!SERVER_KNOWN || r.acquired !== true || inLibrary) return '';
      return '<div class="detail"><div class="never-pushed">' + SVG_WARN_SM
        + '<span>liberated, never pushed</span></div></div>';
    }

    // The server-holds-a-different-edition mark: same tri-state guard as
    // neverPushedHtml above (SERVER_EDITIONS_KNOWN), and the same
    // different-date requirement rip::ab_editions uses server-side — parts
    // of one issue share a publication date and must never be read as
    // alternative editions of each other.
    function otherEditionHtml(r) {
      if (!SERVER_EDITIONS_KNOWN) return '';
      var ra = norm(r.authors && r.authors[0]), rt = norm(r.title);
      var rp = (r.published || '').slice(0, 10);
      for (var i = 0; i < SERVER_EDITIONS.length; i++) {
        var e = SERVER_EDITIONS[i];
        var ep = (e.published || '').slice(0, 10);
        if (!ep || !rp || ep === rp) continue;
        if (norm(e.author) === ra && norm(e.title) === rt) {
          return '<div class="detail"><div class="other-edition">' + SVG_WARN_SM +
                 '<span>you own the ' + esc(ep.slice(0, 4)) + ' edition</span></div></div>';
        }
      }
      return '';
    }

    // The Audible Plus marks. An Audible Plus title is LICENSED while it sits
    // in the catalog, not owned: when it leaves, the licence goes with it,
    // LibationCli can no longer liberate it (it exits 0 having produced
    // nothing — see rip::ab_worker's acquire verification), and a title that
    // was never ripped is gone for good. Four Talon Saga books were lost that
    // way with no warning at all, which is what these two lines exist to
    // prevent.
    //
    //   plus && absent          the licence has ALREADY lapsed. This is the
    //                           honest version of a row that looks rippable
    //                           and silently is not. Independent of the
    //                           server fetch — both facts come off the row.
    //   plus && !absent && !stored
    //                           still borrowed, still available: the warning
    //                           that would have saved the Talon Saga.
    //
    // Strict === true on both flags, the same discipline neverPushedHtml
    // applies to r.acquired: a row from a provider that does not emit these
    // keys must render nothing, never a claim invented from `undefined`.
    // The borrowed line is NOT gated on SERVER_KNOWN, and that difference
    // from neverPushedHtml is deliberate. neverPushedHtml asserts a
    // divergence BETWEEN TWO SYSTEMS ("Libation has it, cantina does not")
    // and genuinely needs the server's answer before it can claim anything.
    // This line asserts only "this title is borrowed, act soon" — true from
    // the row alone. Gating it on SERVER_KNOWN made the warning vanish
    // exactly when it matters most: --server-library failing (server down,
    // VPN off) leaves SERVER_KNOWN false for the panel's whole lifetime
    // (library-dialog.lua returns without calling setServerLibrary), and
    // every borrowed mark disappeared — the warning whose absence cost four
    // Talon Saga books. The inLibrary half stays: it only suppresses a
    // redundant nag about a book already on the server, and it is already
    // false whenever SERVER_KNOWN is.
    function audiblePlusHtml(r, inLibrary) {
      if (r.plus !== true) return '';
      if (r.absent === true) {
        return '<div class="detail"><div class="plus-lapsed">' + SVG_LOCK_SM
          + '<span>Audible Plus &mdash; licence lapsed, can no longer be ripped</span></div></div>';
      }
      if (inLibrary) return '';
      return '<div class="detail"><div class="plus-borrowed">' + SVG_LOCK_SM_WARN
        + '<span>Audible Plus &mdash; borrowed; rip before it lapses</span></div></div>';
    }

    // One inline identity field, shared by files mode's editHtml (below)
    // and library mode's libraryEditionHtml. Not a files-mode-only helper:
    // task 5 puts the SAME markup/validation the Edition field already used
    // in files mode behind library rows too, and duplicating this function
    // per mode is exactly the kind of drift that would let the two fall out
    // of sync.
    //
    // data-edit-row, NOT data-row: the enclosing .row div already carries
    // data-row, and closestAttr() walks outward from the event target —
    // reusing the name would make every field resolve to its own row div.
    // The invalid mark is seeded AT RENDER, not only on input: the folder
    // provider hands us an empty author for every derived_from:"filename"
    // row, so the field that needs attention is already wrong the moment it
    // appears and must say so without being touched first.
    //
    // Everything is escaped through esc(): these strings come out of
    // filenames and embedded audio tags (or, for a library row, Audible
    // metadata), all attacker-adjacent, and they land in an attribute value
    // here.
    function editField(r, name, value, placeholder, cls, validFn) {
      var ok = (validFn || titleValid)(value);
      return '<input class="edit-input ' + cls + (ok ? '' : ' invalid') + '"'
        + ' data-edit-row="' + esc(r.id) + '"'
        + ' data-field="' + name + '" type="text" autocomplete="off" spellcheck="false"'
        + ' placeholder="' + placeholder + '" value="' + esc(value) + '">';
    }

    // Files mode's identity editor: the row's author and title as two live
    // fields, seeded with whatever rip-provider-folder derived, plus a
    // marker naming WHERE it derived them from.
    //
    // This is the whole reason the folder source exists. Importing a book
    // you already own used to mean typing a path, an author and a title
    // into three fields — twelve times for a twelve-book series. Here the
    // guess is already in the field and the operator only corrects the two
    // rows that got it wrong.
    function editHtml(r) {
      var from = r.derived_from;
      var mark = '';
      if (typeof from === 'string' && from !== '') {
        // hasOwnProperty, not a bare lookup: "constructor"/"toString" are
        // inherited members of every object literal, and a bare lookup
        // would render one of those as the label instead of the value the
        // provider actually reported.
        var label = Object.prototype.hasOwnProperty.call(DERIVED_LABEL, from)
          ? DERIVED_LABEL[from] : from;
        mark = '<span class="derived" data-from="' + esc(from) + '">' + esc(label) + '</span>';
      }
      // These fields REPLACE the static name/byline in files mode rather
      // than sitting under them. Two views of one identity, one of them
      // stale between renders (applyEdit deliberately does not re-render —
      // it would destroy the field being typed in and its caret), is the
      // shape that lets an operator read a corrected title while the row
      // still ships the guess.
      return '<div class="edit">'
        + editField(r, 'title', r.title || '', 'Title', 'edit-title')
        + '<div class="edit-by">'
        + editField(r, 'author', r.authors[0] || '', 'Author', 'edit-author')
        // Third, optional field. Empty means "no edition" (the default) and
        // is never invalid — editionValid, not titleValid, is the one
        // validator here that lets '' through. Setting it is what composes
        // <Author>/<Title> (<Edition>) in applyEdit below, which is also
        // what clears the stored-book block (isStored/storedHtml): the
        // composed path stops colliding, no special case needed either
        // place.
        + editField(r, 'edition', r.edition || '', 'Edition', 'edit-edition', editionValid)
        + mark
        + '</div>'
        + '</div>';
    }

    // Library mode's ONE editable field. Library rows render `name`/
    // `byline` below (rowHtml), never editHtml — author and title stay
    // non-editable there on purpose: this adds a single field, not inline
    // editing of Audible metadata. Rewriting Audible-derived identity in
    // place is exactly what the folder provider's inline editing exists to
    // keep separate (docs/superpowers/specs/2026-08-25-audiobook-editions-
    // design.md, "The panel: an Edition field, in both modes").
    //
    // Reuses editField/editionValid verbatim — same markup, same
    // validation, same `field === 'edition'` branch the shared `input`
    // handler and applyEdit already dispatch on, so a set edition composes
    // <Author>/<Title> (<Edition>) here exactly as it does in files mode,
    // with no mode-specific composition added.
    function libraryEditionHtml(r) {
      return '<div class="edit-by">' + editField(r, 'edition', r.edition || '', 'Edition', 'edit-edition', editionValid) + '</div>';
    }

    // The duplicate mark. rip::_validate_ab_plan refuses the WHOLE plan on
    // two items composing one <Author>/<Title>, so this row is excluded to
    // save the rest of the selection — and it says so, naming the path they
    // collide on, because two rows can look completely different (different
    // folders, different formats) and still stage as the same book.
    function storedHtml(r) {
      if (!isStored(r)) return '';
      return '<div class="detail"><div class="dup-blocked">' + SVG_WARN_SM
        + '<span>already on cantina as ' + esc(r.path) + ' — set an Edition to rip this as a separate edition</span></div></div>';
    }

    function duplicateHtml(r) {
      if (!isDuplicate(r)) return '';
      return '<div class="detail"><div class="dup-blocked">' + SVG_WARN_SM
        + '<span>another selected row already stages as ' + esc(r.path) + '</span></div></div>';
    }

    function rowHtml(r) {
      var selected = SELECTED.has(r.id);
      var inLibrary = SERVER.has(r.path);
      var name = esc(r.title) + (r.subtitle ? ': ' + esc(r.subtitle) : '');
      var cover = r.cover
        ? '<div class="cover">' + SVG_BOOK + '<img src="' + esc(r.cover) + '" onerror="this.remove()"></div>'
        : '<div class="cover">' + SVG_BOOK + '</div>';
      return '<div class="row" data-row="' + esc(r.id) + '" data-selected="' + selected + '" data-inlibrary="' + inLibrary + '" data-focused="' + (r.id === FOCUS_ID) + '" data-blocked="' + (!pathValid(r) || isStored(r) || isDuplicate(r)) + '">'
        + '<div class="rowline">'
        + cover
        + (isFiles()
            ? '<div class="text">' + editHtml(r) + '</div>'
            : '<div class="text"><div class="name">' + name + '</div><div class="byline">' + bylineHtml(r) + '</div>' + libraryEditionHtml(r) + '</div>')
        + '<div class="meta">' + metaHtml(r) + '</div>'
        + '<span class="toggle" data-toggle="' + esc(r.id) + '" data-on="' + selected + '">' + (selected ? 'Rip' : 'Skip') + '</span>'
        + '</div>'
        + storedHtml(r)
        + duplicateHtml(r)
        + audiblePlusHtml(r, inLibrary)
        + neverPushedHtml(r, inLibrary)
        + otherEditionHtml(r)
        + '</div>';
    }

    // The source bar: WHICH library these rows came from, and how many
    // candidates it produced. The root is rendered in full and prominently
    // rather than as a trailing crumb — picking the wrong folder is the
    // easy mistake here, and it announces itself as "hundreds of rows",
    // which looks exactly like a successful browse until you read the path.
    function renderSource() {
      var el = document.getElementById('source');
      var n = ROWS.length;
      var count = LOADING
        ? '<span class="source-count">scanning&hellip;</span>'
        : '<span class="source-count">' + n + ' candidate' + (n === 1 ? '' : 's') + '</span>';
      el.setAttribute('data-kind', SOURCE.kind);
      if (!isFiles()) {
        el.innerHTML = '<span class="source-label">Source</span>'
          + '<span class="source-name">Audible library</span>'
          + count;
        return;
      }
      // data-source-action is what the delegated listener below reads —
      // this element is rebuilt on every render, so nothing here can hold
      // a listener of its own.
      el.innerHTML = '<span class="source-label">Files</span>'
        + '<span class="source-root" title="' + esc(SOURCE.root) + '">' + esc(SOURCE.root) + '</span>'
        + count
        + '<span class="source-back" data-source-action="library">Audible library</span>';
    }

    function render() {
      var el = document.getElementById('rows');
      // Before ANY row is painted: rowHtml reads RIPPABLE_IDS to decide
      // whether a row lost the dedupe.
      refreshRippable();
      renderSource();
      if (LOADING && ROWS.length === 0) {
        el.innerHTML = '<div class="empty">'
          + (isFiles() ? 'scanning ' + esc(SOURCE.root) + '…' : 'loading library…') + '</div>';
        renderFooter();
        return;
      }
      var list = visible();
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">' + (ROWS.length === 0 ? 'nothing to show' : 'no matches') + '</div>';
        renderFooter();
        return;
      }
      var html = '';
      for (var i = 0; i < list.length; i++) html += rowHtml(list[i]);
      el.innerHTML = html;
      renderFooter();
    }

    function renderFooter() {
      refreshRippable();
      var sel = ROWS.filter(function (r) { return SELECTED.has(r.id); });
      var ok = RIPPABLE;
      var blocked = sel.length - ok.length;
      // Named separately: "needs an author" and "is a second copy of a book
      // already selected" call for completely different actions, and a
      // single "N blocked" would leave the operator hunting for which.
      var needId = sel.filter(function (r) { return !pathValid(r); }).length;
      var dupes = blocked - needId;
      var sumEl = document.getElementById('summary');
      var btn = document.getElementById('btnStart');
      var msgs = [];
      if (needId) {
        msgs.push(needId + ' need' + (needId === 1 ? 's' : '') + ' an author and a title');
      }
      if (dupes) {
        msgs.push(dupes + ' duplicate' + (dupes === 1 ? '' : 's') + ' of a book already selected');
      }
      var blockedHtml = msgs.length
        ? '<span class="sum-blocked">' + msgs.join(' &middot; ') + '</span>'
        : '';
      if (ok.length === 0) {
        sumEl.innerHTML = blockedHtml;
        btn.classList.add('disabled');
        return;
      }
      btn.classList.remove('disabled');
      var n = ok.length;
      var secs = ok.reduce(function (a, r) { return a + (r.duration_s || 0); }, 0);
      sumEl.innerHTML = '<span class="sum-strong">' + n + ' book' + (n === 1 ? '' : 's')
        + '</span> <span class="meta-text">· ' + esc(hms(secs)) + ' &rarr; rip &amp; push</span>'
        + (blocked ? ' <span class="meta-text">·</span> ' + blockedHtml : '');
    }

    //----------------------------------------------------------------------
    // Interaction
    //----------------------------------------------------------------------
    // Independent per-row toggle: no radio semantics, nothing here ever
    // demotes another row (unlike rip-session's Feature control).
    function toggleRow(id) {
      // Deselecting a stored row stays allowed: it can be selected already if
      // an inline edit moved its path ONTO something the server holds, and
      // refusing to let go of it would strand the operator.
      if (!SELECTED.has(id)) {
        var r = rowById(id);
        if (r && isStored(r)) return;
        SELECTED.add(id);
      } else {
        SELECTED.delete(id);
      }
      render();
    }

    function rowById(id) {
      for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) return ROWS[i];
      return null;
    }

    // Apply one inline identity edit to the row IN PLACE.
    //
    // In place, on the ROWS entry itself, because start() posts those exact
    // objects: an edit applied to a rendering copy would show on screen and
    // then ship the original guess anyway.
    //
    // `path` is recomposed HERE rather than left to the worker. It is the
    // third argument rip-provider-folder's acquire receives, and the
    // <Author>/<Title> the book stages and then pushes under — so it has to
    // equal what these two fields say the moment they say it, not what the
    // provider derived when it listed the tree.
    //
    // A third field, `edition`, is optional and APPENDS " (" + edition + ")"
    // to that composed path rather than replacing any of it — the exact
    // suffix rip::ab_worker strips back off to resolve the shared base book
    // (docs/superpowers/specs/2026-08-25-audiobook-editions-design.md, S3/S4).
    // Empty (the default) composes the base path unchanged, byte-identical
    // to before this field existed.
    //
    // An emptied author collapses to the title alone, matching the folder
    // provider's own rule (rip-provider-folder's cmd_list): "" + "/" + title
    // is a LEADING slash, an absolute path where a two-component relative
    // one belongs.
    //
    // No render() call: re-rendering would replace the very input being
    // typed into and drop the caret. The row's displayed identity IS these
    // fields in files mode (see editHtml), so nothing on screen goes stale.
    function applyEdit(id, field, value) {
      var r = rowById(id);
      if (!r) return;
      if (field === 'author') r.authors = value === '' ? [] : [value];
      else if (field === 'title') r.title = value;
      else if (field === 'edition') r.edition = value;
      else return;
      var a = r.authors[0] || '';
      var t = String(r.title == null ? '' : r.title);
      var e = String(r.edition == null ? '' : r.edition).trim();
      // FILES mode recomposes from the two editable fields — that is the
      // whole point of them, and it matches rip-provider-folder's own rule.
      // LIBRARY mode has no editable author or title, so there is nothing to
      // recompose FROM: the provider's own path is the base and only the
      // suffix is ours to add. Recomposing there dropped the subtitle out of
      // every libation path ("Title: Subtitle" is the folder; `title` is
      // bare), which both pointed the worker at a base book that does not
      // exist AND made touch-and-clear — type one character, delete it —
      // silently unblock a row already stored on cantina.
      var basep = isFiles() ? (a === '' ? t : a + '/' + t) : String(r.base_path || r.path || '');
      r.path = basep + (e === '' ? '' : ' (' + e + ')');
    }

    // Keyboard row navigation, ported from the disc panel's moveFocus idiom
    // (rip-session.html). FOCUS_ID is an id rather than an index because the
    // visible list changes under the operator as they type in the search box
    // or flip the "show library" chip — an index would silently point at a
    // different book. When the focused row filters out, focus falls to the
    // first visible row rather than vanishing.
    function visibleIndexOfFocus(list) {
      for (var i = 0; i < list.length; i++) if (list[i].id === FOCUS_ID) return i;
      return -1;
    }

    function moveFocus(delta) {
      var list = visible();
      if (list.length === 0) { FOCUS_ID = null; return; }
      var i = visibleIndexOfFocus(list);
      // No focus yet: ArrowDown starts at the top, ArrowUp at the bottom.
      if (i === -1) i = delta > 0 ? 0 : list.length - 1;
      else i = Math.max(0, Math.min(list.length - 1, i + delta));
      FOCUS_ID = list[i].id;
      render();
      var el = document.querySelector('.row[data-focused="true"]');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }

    function toggleFocused() {
      if (!FOCUS_ID) return;
      var list = visible();
      if (visibleIndexOfFocus(list) === -1) return; // focused row is filtered out
      toggleRow(FOCUS_ID);
    }

    function start() {
      // Filtered, not merely refused: renderFooter has already disabled
      // Start when NOTHING selected is rippable, and named the blocked
      // count when only some are — so this never silently drops a row the
      // operator was not told about.
      refreshRippable();
      var items = RIPPABLE;
      if (items.length === 0) return;
      post({ action: 'start', provider: providerName(), items: items });
    }

    function dismiss() { post({ action: 'dismiss' }); }

    // commitActiveField() — blur whatever field has focus, so its `blur`
    // listener runs BEFORE the action about to be taken reads the model.
    //
    // EVERY mousedown handler in this panel calls e.preventDefault(). That is
    // what stops a click on a chip or the footer button from pulling focus
    // out of the row list — and it also suppresses the FOCUS CHANGE, which is
    // what a blur is. So the focused author input never blurred,
    // authorDisplay() never ran, and start() posted the value the
    // PER-KEYSTROKE `input` listener last wrote: the raw spelling. Type
    // "J.K. Rowling", click Start Rip, and the raw form reaches the path, the
    // directory and album_artist. This panel is the ONLY place the canonical
    // form can enter for an author the server has never seen, and nothing
    // downstream recovers it — --canonicalize-authors repairs the library
    // afterwards, at the cost of a remux of everything already written.
    //
    // Called by every preventDefault'd handler, not only Start: the chips and
    // the source switch all re-render, and a render destroys the field being
    // edited without ever blurring it, losing the same normalisation just as
    // silently. Dismiss is included for uniformity — one rule, no handler
    // that has to be remembered as the exception.
    //
    // The keyboard commits already blur explicitly (Enter, ArrowUp/Down);
    // the click was never considered. (Review finding F1, 2026-08-26.)
    function commitActiveField() {
      var el = document.activeElement;
      if (el && typeof el.blur === 'function') el.blur();
    }

    // Ask Lua to open the folder picker (ripper/init.lua's M.browse). The
    // panel posts and then does nothing: the operator may cancel the
    // picker, and a panel that had already switched itself into "scanning"
    // would have to be talked back out of it. Lua drives the switch, via
    // __setSource, only once it actually has a root.
    function browse() { post({ action: 'browse' }); }

    // The way back to the Audible library without reopening the panel.
    function toLibrary() { if (isFiles()) post({ action: 'library' }); }

    // Mirrors rip::_check_title (home/dot_local/lib/rip.zsh): non-empty, no
    // slash (it becomes a path component under <Author>/<Title>), never "."
    // or "..". Applied to both the author and title fields, exactly as the
    // disc panel's nameValid mirrors rip::_check_extra_name — the server-side
    // check still runs regardless; this is feedback only.
    function titleValid(n) {
      n = String(n || '').trim();
      return n !== '' && n !== '.' && n !== '..' && n.indexOf('/') === -1;
    }

    // Same rule, minus the non-empty requirement: an edition label is
    // OPTIONAL (empty is the default, and composes the base <Author>/<Title>
    // path unchanged), but once present it becomes a path component exactly
    // like author/title and must follow the same no-slash, never "."/".."
    // rule — an edition containing '/' would inject a path component.
    function editionValid(n) {
      n = String(n || '').trim();
      return n === '' || (n !== '.' && n !== '..' && n.indexOf('/') === -1);
    }

    // authorDisplay(n) — the canonical DISPLAY form of an author name: a
    // single letter, a period, then immediately another letter (no space
    // between them) gets a space inserted after the period.
    //
    // A SECOND IMPLEMENTATION of rip::_author_display (home/dot_local/lib/
    // rip.zsh) — this is a JavaScript copy of that exact zsh rule, not a
    // relative of it. The two must not drift; that function's own header
    // names this file as its counterpart. Reimplementing rather than
    // shelling out is deliberate: this runs on every blur of the author
    // field, a keystroke-latency path, and forking a subprocess there is not
    // an option.
    //
    // Two letters before the period is an abbreviation, not two initials
    // ("Dr.Smith" stays as-is — "Dr" is not "D" + "r"), and a period already
    // followed by a space is already correct ("St. Martin" is untouched).
    // Scanned character by character, exactly as the zsh version is, rather
    // than with a single regex substitution: a naive global "letter.letter"
    // replace would consume the letter after a period as part of the NEXT
    // match, silently skipping every other initial in "J.K.R. Tolkien".
    function authorDisplay(n) {
      n = String(n == null ? '' : n);
      var letter = /[A-Za-z]/;
      var out = '';
      for (var i = 0; i < n.length; i++) {
        var c = n.charAt(i);
        out += c;
        if (c === '.') {
          var prev = n.charAt(i - 1);
          var prev2 = n.charAt(i - 2);
          var next = n.charAt(i + 1);
          if (letter.test(prev) && !letter.test(prev2) && letter.test(next)) {
            out += ' ';
          }
        }
      }
      return out;
    }

    // Mirrors the PER-PATH half of rip::_validate_ab_plan
    // (home/dot_local/lib/rip.zsh): split on the FIRST slash for the author
    // and the LAST for the title, run rip::_check_title\'s rule over both,
    // then require the roundtrip `author + "/" + title === path` — which is
    // what actually enforces "exactly two segments" and closes the
    // "A/../../etc/passwd" traversal the server-side check was hardened
    // against.
    //
    // NOT the whole validator, and the difference matters: _validate_ab_plan
    // ALSO refuses the whole plan when two items compose the same
    // <Author>/<Title>. That rule is plan-level and cannot be decided from
    // one row — see rippable() below, which is where it lives. An earlier
    // comment here claimed to mirror the validator "exactly", and that claim
    // is what made the duplicate hole invisible for a round.
    //
    // This has to run on EVERY selected row, not just edited ones. The
    // folder provider emits a single-segment path for every
    // derived_from:"filename" book — a flat tree of loose .m4b files, which
    // is precisely the collection browse mode exists to import — and
    // _validate_ab_plan aborts the WHOLE plan on the first offender. One
    // blank author would kill 39 correctly-named books, and the panel has
    // already closed by the time that happens, so the selection is gone
    // with it. Blocking the one row is the whole difference.
    function pathValid(r) {
      var p = String(r && r.path == null ? "" : r.path);
      var i = p.indexOf("/");
      if (i === -1) return false;
      var author = p.slice(0, i), title = p.slice(p.lastIndexOf("/") + 1);
      if (!titleValid(author) || !titleValid(title)) return false;
      return author + "/" + title === p;
    }

    // The selected rows that would actually survive rip::_validate_ab_plan,
    // in render order. TWO rules, not one: the per-path shape above, and the
    // plan-level "no two items compose the same <Author>/<Title>" — which
    // refuses the WHOLE plan server-side, so one duplicate pair would take
    // every other selected book down with it, after the panel has closed.
    //
    // Reachable without any editing at all: rip-provider-folder keys a row
    // by DIRECTORY (id: $d) but composes `path` from the embedded tags
    // first, so a re-download under a different folder, a second format, or
    // a backup copy yields two rows with distinct ids and one identical
    // path. Nothing about either row looks wrong on its own.
    //
    // First in render order wins; the losers are marked blocked and say why
    // (duplicateHtml), so the operator sees WHICH copy is excluded rather
    // than having one silently dropped.
    //
    // Provider-agnostic on purpose: two Audible rows can compose one path
    // too (a re-release under the same author and title), and the server
    // rule does not care which provider produced them.
    // A book the server already holds at this composed path. The backend
    // refuses it anyway (rip::ab_have, keyed on the same path), so letting it
    // into the plan only produced a refusal the operator never saw. Note this
    // follows INLINE EDITS: retitling, or — the intended route — setting the
    // Edition field, to something the server does not hold clears the block,
    // which is exactly the way out.
    function isStored(r) {
      return SERVER.has(r.path);
    }

    function rippable() {
      var seen = {}, out = [];
      for (var i = 0; i < ROWS.length; i++) {
        var r = ROWS[i];
        if (!SELECTED.has(r.id) || !pathValid(r)) continue;
        if (isStored(r)) continue;
        if (Object.prototype.hasOwnProperty.call(seen, r.path)) continue;
        seen[r.path] = true;
        out.push(r);
      }
      return out;
    }

    // Recomputed at the top of every render pass and reused by rowHtml,
    // renderFooter and start(), so the three can never disagree about which
    // rows are shipping.
    var RIPPABLE = [];
    var RIPPABLE_IDS = new Set();
    function refreshRippable() {
      RIPPABLE = rippable();
      RIPPABLE_IDS = new Set(RIPPABLE.map(function (r) { return r.id; }));
    }

    // A selected row that is valid on its own but lost the dedupe. Excludes
    // stored rows: those are out of RIPPABLE for their OWN reason, and
    // reporting them as losing a dedupe against a sibling would be a lie.
    function isDuplicate(r) {
      return SELECTED.has(r.id) && pathValid(r) && !isStored(r) && !RIPPABLE_IDS.has(r.id);
    }

    //----------------------------------------------------------------------
    // Events
    //----------------------------------------------------------------------
    function closestAttr(node, attr) {
      while (node && node.getAttribute) {
        if (node.getAttribute(attr) != null) return node;
        node = node.parentNode;
      }
      return null;
    }

    function bindEvents() {
      var rowsEl = document.getElementById('rows');

      rowsEl.addEventListener('mousedown', function (e) {
        var toggle = closestAttr(e.target, 'data-toggle');
        if (!toggle) return;
        e.preventDefault();
        toggleRow(toggle.getAttribute('data-toggle'));
      });

      // Files mode's inline identity fields. `input` bubbles, so one
      // delegated listener covers every row's two fields — the row list is
      // rebuilt wholesale on each render, so a per-field listener would be
      // thrown away with it.
      //
      // Slashes are stripped as they are typed: both halves become a path
      // component under <Author>/<Title>, and rip::_check_title rejects a
      // name containing one outright.
      rowsEl.addEventListener('input', function (e) {
        var t = e.target;
        var host = closestAttr(t, 'data-edit-row');
        if (!host) return;
        var cleaned = String(t.value).replace(/\//g, '');
        if (cleaned !== t.value) {
          var caret = Math.max(0, (t.selectionStart || 1) - 1);
          t.value = cleaned;
          t.setSelectionRange(caret, caret);
        }
        // BOTH author and title, not just the title. An empty author
        // composes a single-segment path, which rip::_validate_ab_plan
        // refuses for the WHOLE plan, so the inline editor has to hold that
        // line here. Edition is the one field where empty is legal — this
        // is the same field/validator pairing editHtml's field() uses at
        // render time, kept in sync here for every keystroke after.
        var field = host.getAttribute('data-field');
        var valid = field === 'edition' ? editionValid(t.value) : titleValid(t.value);
        t.classList.toggle('invalid', !valid);
        applyEdit(host.getAttribute('data-edit-row'), field, t.value.trim());
        // The footer counts only rippable rows, so an edit that blocks or
        // unblocks one has to repaint it. The ROW is deliberately not
        // re-rendered (it would destroy the field being typed in).
        renderFooter();
      });

      // Author normalisation happens HERE, on blur — never in the `input`
      // listener above. Rewriting the field per keystroke would move the
      // caret mid-word: typing "J." would become "J. " immediately, and the
      // "K" the operator is still typing would land after the space instead
      // of after the letter it belongs to. Committing a field already blurs
      // it (Enter, ArrowUp/Down above), so this fires exactly when the
      // operator has finished, not while they are still typing.
      //
      // blur does not bubble, so the delegated `input` listener's technique
      // (attach once on #rows, let events surface from every row) needs the
      // CAPTURE phase instead — blur fires during capture on the way down to
      // the target, same as focus.
      rowsEl.addEventListener('blur', function (e) {
        var t = e.target;
        var host = closestAttr(t, 'data-edit-row');
        if (!host || host.getAttribute('data-field') !== 'author') return;
        var normalized = authorDisplay(t.value);
        if (normalized === t.value) return;
        t.value = normalized;
        t.classList.toggle('invalid', !titleValid(t.value));
        applyEdit(host.getAttribute('data-edit-row'), 'author', t.value.trim());
        renderFooter();
      }, true);

      var searchTimer = null;
      document.getElementById('search').addEventListener('input', function (e) {
        var val = e.target.value;
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          searchTimer = null;
          QUERY = val;
          render();
        }, 150);
      });

      document.getElementById('chipShowLibrary').addEventListener('mousedown', function (e) {
        e.preventDefault();
        commitActiveField();
        SHOW_LIBRARY = !SHOW_LIBRARY;
        this.setAttribute('data-active', String(SHOW_LIBRARY));
        render();
      });

      document.getElementById('chipBrowse').addEventListener('mousedown', function (e) {
        e.preventDefault();
        commitActiveField();
        browse();
      });

      // Delegated: #source's contents are rebuilt on every render, so the
      // "Audible library" way back cannot own a listener of its own.
      document.getElementById('source').addEventListener('mousedown', function (e) {
        var el = closestAttr(e.target, 'data-source-action');
        if (!el) return;
        e.preventDefault();
        commitActiveField();
        if (el.getAttribute('data-source-action') === 'library') toLibrary();
      });

      document.getElementById('btnStart').addEventListener('mousedown', function (e) { e.preventDefault(); commitActiveField(); start(); });
      document.getElementById('btnDismiss').addEventListener('mousedown', function (e) { e.preventDefault(); commitActiveField(); dismiss(); });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); dismiss(); return; }

        // Typing in the search box or an inline edit field owns the arrows
        // and space — the caret needs them. Only Escape and Enter reach past
        // a text field, matching the disc panel's rule.
        var t = e.target;
        var inText = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');

        if (e.key === 'Enter') {
          e.preventDefault();
          if (inText) { t.blur(); return; } // commit the field; a second Enter starts
          start();
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); if (inText) t.blur(); moveFocus(1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); if (inText) t.blur(); moveFocus(-1); return; }
        if (inText) return;
        if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggleFocused(); return; }
      });
    }

    //----------------------------------------------------------------------
    // Boot
    //----------------------------------------------------------------------
    LOADING = !!(PAYLOAD && PAYLOAD.loading);
    SOURCE = sourceOf(PAYLOAD && PAYLOAD.source);
    ROWS = normalizeRows(PAYLOAD && PAYLOAD.rows);
    bindEvents();
    render();
  })();
  </script>
</body>
</html>
