# manifest.toml — the backup SPEC: WHAT to capture + how much to keep.
# Machine-independent and committed; per-machine deployment (staging path,
# targets, passphrase command) lives in the local-only config.toml.
#
#   capture = roots − deny − chezmoi-managed − files any captured repo ignores
#
# The chezmoi and git filters are automatic — never hand-list managed files
# or gitignored artifacts here.

exclude_chezmoi_managed = true

# A root is a path STRING (defaults: bundle_unpushed = true,
# untracked_warn_size = "50m") or a TABLE with per-root git overrides.
roots = [
  "~/.config",
  "~/.local/state",
  "~/.local/share",
  "~/.ssh",
  "~/Library/LaunchAgents",
  "~/Library/Preferences",
  # Application Support holds app BULK (Steam alone: 122 GB) — capture only
  # the config-bearing corners, never the whole dir. Missing paths are
  # skipped, so machine-specific entries are safe to list.
  "~/Library/Application Support/Code/User",
  "~/Library/Application Support/JetBrains",
  "~/Projects",
]

deny = [
  "~/.cache",
  "~/.local/share/nvim",
  "~/.local/share/mise",
  "~/.local/share/mlx",                 # downloaded LLM weights (9+ GB, regenerable)
  "~/.local/share/rustup",
  "~/.local/share/uv",
  "~/.local/share/go",
  "~/.local/share/opencode",
  "~/.local/share/cargo/registry",      # MISE_CARGO_HOME registry cache
  "~/.cargo/registry",
  "~/.gradle",
  "~/Library/Caches",
  "~/Library/Application Support/JetBrains/*/plugins",  # ~1 GB/IDE, marketplace-regenerable
  "**/*.sock",
  "**/.DS_Store",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/Cache/**",
  "**/cache/**",
]

# [policy] omitted -> the default §5 ladder (30m/1h/6h/12h/day/week/month/year).
