# manifest.toml — the backup SPEC: WHAT to capture + how much to keep.
# Machine-independent and committed; per-machine deployment (staging path,
# targets, passphrase command) lives in the local-only config.toml.
#
#   capture = roots − deny − chezmoi-managed − files any captured repo ignores
#
# The chezmoi and git filters are automatic — never hand-list managed files
# or gitignored artifacts here.

exclude_chezmoi_managed = true

# A root is a path STRING (defaults: bundle_unpushed = true,
# untracked_warn_size = "50m") or a TABLE with per-root git overrides.
roots = [
  "~/.config",
  "~/.local/state",
  "~/.local/share",
  "~/.ssh",
  "~/Library/LaunchAgents",
  "~/Library/Preferences",
  # Application Support holds app BULK (Steam alone: 122 GB) — capture only
  # the config-bearing corners, never the whole dir. Missing paths are
  # skipped, so machine-specific entries are safe to list.
  "~/Library/Application Support/Code/User",
  "~/Library/Application Support/JetBrains",
  # Zen browser: the whole profile (prefs, extensions + their storage, logins,
  # history, open tabs/workspaces). `system-update` upgrades the cask, which
  # quits Zen mid-session; on 2026-11-07 the relaunch reset the profile to a
  # blank one (old data moved to ~/Desktop/Old Zen Data). This is the safety
  # net. Live SQLite files may be captured mid-write — restore from an earlier
  # rung if one is torn; Zen's own zen-sessions-backup/ + bookmarkbackups/
  # (atomically written, kept below) are the consistent fallbacks for tabs and
  # bookmarks.
  "~/Library/Application Support/zen",
  "~/Projects",
]

deny = [
  "~/.cache",
  "~/.local/share/nvim",
  "~/.local/share/mise",
  "~/.local/share/mlx",                 # downloaded LLM weights (9+ GB, regenerable)
  "~/.local/share/rustup",
  "~/.local/share/uv",
  "~/.local/share/go",
  "~/.local/share/opencode",
  "~/.local/share/cargo/registry",      # MISE_CARGO_HOME registry cache
  "~/.cargo/registry",
  "~/.gradle",
  "~/Library/Caches",
  "~/Library/Application Support/JetBrains/*/plugins",  # ~1 GB/IDE, marketplace-regenerable
  # Zen profile: regenerable/downloaded parts only (site CacheStorage is
  # already covered by **/cache/**). storage/ stays — extension data lives there.
  "~/Library/Application Support/zen/Profiles/*/gmp-*",              # DRM/codec plugins (Widevine, OpenH264), re-downloaded
  "~/Library/Application Support/zen/Profiles/*/storage/temporary",
  "~/Library/Application Support/zen/Profiles/*/security_state",     # cert revocation data, re-fetched
  "~/Library/Application Support/zen/Profiles/*/datareporting",      # telemetry
  "~/Library/Application Support/zen/Profiles/*/saved-telemetry-pings",
  "~/Library/Application Support/zen/Profiles/*/crashes",
  "~/Library/Application Support/zen/Profiles/*/minidumps",
  "~/Library/Application Support/zen/Profiles/*/.parentlock",        # live-instance lock; restoring it is meaningless
  "~/Library/Application Support/zen/restore-backup-*",              # one-off manual-recovery leftovers
  "~/.local/state/terminal-backup",     # the backup's OWN staging/wip — never self-ingest
  "~/.local/state/images",              # system-images backing store — live .sparseimage files (18+ GB, churn); mounted contents already skipped as a separate fs
  "~/.config/cursor/chats",             # Cursor agent chat DBs (store.db): multi-GB, high churn, regenerable
  "~/.local/share/pick-clipboard",      # clipboard DB, ephemeral (atuin kept: it's valuable + append-only, dedups well)
  "~/Projects/3D",                      # 850+ MB of .gcode/.step CAD output, non-git
  "~/Projects/AI/llama.cpp/models",     # downloadable model weights (.gguf)
  "**/build/**",                        # gradle/xcode build output in non-git project dirs
  "**/*.log",                           # debug/error logs (commit-ai 292M, nvim lsp 63M): churn, regenerable
  "**/*.sock",
  "**/.#lk*",                           # gnupg lock litter (spec §2 B: skip .#lk*/S.*)
  "**/S.gpg-agent*",
  "**/.DS_Store",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/Cache/**",
  "**/cache/**",
]

# [policy] omitted -> the default §5 ladder (30m/1h/6h/12h/day/week/month/year).
