
[mgr]
prepend_keymap = [
  { on = "q",     run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },
  { on = "Q",     run = "quit",               desc = "Quit the process" },

  { on = "<Enter>", run = "plugin nice-sidebar enter", desc = "Sidebar: confirm selection; else open / smart-enter" },
  { on = "<C-Space>", run = 'shell -- "$HOME/.local/libexec/yazi-quick-look" "$@"', desc = "Quick Look (floating preview pane over SSH)" },
  { on = "<C-d>", run = "seek 5" },
  { on = "<C-u>", run = "seek -5" },
  { on = "<C-f>", run = "seek 10" },
  { on = "<C-b>", run = "seek -10" },

  { on = "y", run = [ '''shell -- d="${XDG_STATE_HOME:-$HOME/.local/state}/yazi"; mkdir -p "$d"; pbcopy "$@" 2>/dev/null; touch "$d/last-yank"''', "yank" ], desc = "Yank (+ system clipboard)" },
  { on = "x", run = [ '''shell -- d="${XDG_STATE_HOME:-$HOME/.local/state}/yazi"; mkdir -p "$d"; touch "$d/last-yank"''', "yank --cut" ], desc = "Cut (internal)" },
  { on = "p", run = "plugin smart-paste",              desc = "Paste (smart: yank or system clipboard)" },
  { on = "P", run = "plugin smart-paste -- --force",   desc = "Paste forcefully (smart)" },

  { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },
  { on = "2", run = "plugin smart-switch 1", desc = "Switch or create tab 2" },
  { on = "3", run = "plugin smart-switch 2", desc = "Switch or create tab 3" },
  { on = "4", run = "plugin smart-switch 3", desc = "Switch or create tab 4" },
  { on = "5", run = "plugin smart-switch 4", desc = "Switch or create tab 5" },
  { on = "6", run = "plugin smart-switch 5", desc = "Switch or create tab 6" },
  { on = "7", run = "plugin smart-switch 6", desc = "Switch or create tab 7" },
  { on = "8", run = "plugin smart-switch 7", desc = "Switch or create tab 8" },
  { on = "9", run = "plugin smart-switch 8", desc = "Switch or create tab 9" },
  { on = "C", run = "plugin ouch zip", desc = "Compress with ouch" },
  # nice-sidebar — Finder-style sidebar in the parent column (replaces
  # parent-arrow K/J and the H/L bypass jumps). Deferred by default: browse
  # the sidebar, Enter to commit. j/k/h/l/arrows are focus-scoped; Shift+J/K
  # jump live from the panes; G/gg are suppressed while the sidebar is focused.
  { on = "K",          run = "plugin nice-sidebar prev",  desc = "Sidebar: previous item" },
  { on = "J",          run = "plugin nice-sidebar next",  desc = "Sidebar: next item" },
  { on = "<S-Up>",     run = "plugin nice-sidebar prev",  desc = "Sidebar: previous item" },
  { on = "<S-Down>",   run = "plugin nice-sidebar next",  desc = "Sidebar: next item" },
  { on = "H",          run = "plugin nice-sidebar left",  desc = "Focus left: staging -> panes -> sidebar" },
  { on = "<S-Left>",   run = "plugin nice-sidebar left",  desc = "Focus left" },
  { on = "<S-Right>",  run = "plugin nice-sidebar right", desc = "Focus right" },
  { on = "L",          run = "plugin nice-sidebar right", desc = "Focus right: sidebar -> panes -> staging; else bypass" },
  { on = "<Esc>",      run = "plugin nice-sidebar left",  desc = "Step focus back toward the panes" },
  { on = "<Space>",    run = "plugin nice-sidebar space",  desc = "Toggle selection (no move) / unstage in panel" },
  { on = "<A-Space>",  run = "plugin nice-sidebar sspace", desc = "Toggle selection and move / unstage in panel" },
  { on = "<A-s>",      run = "plugin nice-sidebar lane_staged",    desc = "Jump to the Staged holding area" },
  { on = "<A-c>",      run = "plugin nice-sidebar lane_clipboard", desc = "Jump to the Clipboard holding area" },
  { on = "G",          run = "plugin nice-sidebar guard_bot", desc = "Bottom (file list only)" },
  { on = [ "g", "g", ], run = "plugin nice-sidebar guard_top", desc = "Top (file list only)" },
  { on = "h",          run = "plugin nice-sidebar h",     desc = "Leave; at root, focus the sidebar" },
  { on = "<Left>",     run = "plugin nice-sidebar h",     desc = "Leave; at root, focus the sidebar" },
  { on = "l",          run = "plugin nice-sidebar l",     desc = "Enter; from the sidebar, focus the panes" },
  { on = "<Right>",    run = "plugin nice-sidebar l",     desc = "Enter; from the sidebar, focus the panes" },
  { on = "j",          run = "plugin nice-sidebar j",     desc = "Down (list) / next (sidebar)" },
  { on = "<Down>",     run = "plugin nice-sidebar j",     desc = "Down (list) / next (sidebar)" },
  { on = "k",          run = "plugin nice-sidebar k",     desc = "Up (list) / previous (sidebar)" },
  { on = "<Up>",       run = "plugin nice-sidebar k",     desc = "Up (list) / previous (sidebar)" },

  # Directory backstack (H/L are taken by nice-sidebar above)
  { on = "{",          run = "plugin backnav back",    desc = "Back in the directory backstack" },
  { on = "}",          run = "plugin backnav forward", desc = "Forward in the directory backstack" },

  { on = "q", run = "plugin confirm-quit", desc = "Quit Yazi file manager" },
  { on = "t", run = "plugin smart-tab-switch", desc = "Create a tab and enter the hovered directory" },
  { on = "Z", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  { on = "z", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },

  { on = [ "b", "a", ], run = "plugin mactag add", desc = "Tag selected files" },
  { on = [ "b", "r", ], run = "plugin mactag remove", desc = "Untag selected files" },
  { on = [ "b", "p", ], run = "plugin nice-sidebar pin", desc = "Sidebar: pin/unpin this directory" },

  # Terminal Time Machine on the hovered path, in its own zellij tab
  # (dir = explore session, file = diff session scoped to that file).
  { on = [ "g", "t", ], run = 'shell --orphan -- "$HOME/.local/libexec/tm-tab" "$0"', desc = "Time Machine here, in a new tab" },

  # I would love to use these, but they do not work in my environment
  # { on = [ "g", "f", ], run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
  # { on = [ "g", "z", ], run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
]

[input]
prepend_keymap = [{ on = "<Esc>", run = "close", desc = "Cancel input" }]
