[mgr]
# The status bar shows the resolved (readlink -f style) symlink target, so the
# inline " -> target" in the file list columns is redundant.
show_symlink = false

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
  { url = "*", run = "mactag", group = "mactag" },
  { url = "*/", run = "mactag", group = "mactag" },
]

prepend_preloaders = [
  # Warm the preview script's raster cache (frames, pages, sheets, covers).
  { mime = "{image,video,audio}/*", run = "preview-shim" },
  { mime = "application/pdf", run = "preview-shim" },
  { mime = "font/*", run = "preview-shim" },
  { mime = "application/vnd.ms-opentype", run = "preview-shim" },
  { mime = "{image/vnd.adobe.photoshop,application/postscript}", run = "preview-shim" },
]

prepend_previewers = [
  # Raster types → preview.yazi shim (script logic, native image painting).
  { mime = "{image,video,audio}/*", run = "preview-shim" },
  { mime = "application/pdf", run = "preview-shim" },
  { mime = "font/*", run = "preview-shim" },
  { mime = "application/vnd.ms-opentype", run = "preview-shim" },
  { mime = "{image/vnd.adobe.photoshop,application/postscript}", run = "preview-shim" },
  { url = "*.{ttf,otf,woff,woff2,ttc,psd,ai,eps}", run = "preview-shim" },
  # Everything else (files only; the built-in folder previewer keeps
  # directories) → the same script's text pipeline through piper, which
  # provides line-based scroll via skip.
  { url = "*", run = 'piper -- preview "$1"' },
]

[preview]
# Code preview syntax highlighting uses the generated `system` tmTheme (from
# .chezmoidata/theme.yaml, shared with bat), so previews follow the active theme
# instead of a vendored flavor's tmtheme.
syntect_theme = "~/.config/bat/themes/chezmoi-system.tmTheme"
