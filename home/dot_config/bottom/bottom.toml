# Optimized bottom (btm) Configuration

[flags]
# Sets how often data is refreshed (1 second is the sweet spot for accuracy vs overhead)
rate = "1s"

# Shows the list scroll position tracker in the widget titles
show_table_scroll_position = true

# Hides unnecessary spacing inside tables to display more information at once
hide_table_gap = true

# Temperatures are displayed in Celsius (change to "f" if preferred)
temperature_type = "c"

# Better defaults for the process monitoring widget
[processes]
# Groups processes with the same name together by default (like htop)
default_grouped = true

# Shows the full command path instead of just the process name
process_command = true

# Uses regular expressions by default when searching with the '/' key
regex = true

# Sets CPU% metrics relative to the current usage rather than overall system capacity
current_usage = true

[network]
# Displays network speeds in bytes instead of bits (easier to read for file transfers)
network_use_bytes = true

[color]
# Sets a gorgeous, eye-friendly theme built into bottom
# Options include: default, default-light, gruvbox, gruvbox-light, nord, nord-light
theme = "catppuccin-mocha"

[styles.cpu]
all_entry_color = "#f5e0dc"
avg_entry_color = "#eba0ac"
cpu_core_colors = ["#f38ba8","#fab387","#f9e2af","#a6e3a1","#74c7ec","#cba6f7"]
[styles.memory]
ram_color = "#a6e3a1"
cache_color = "#f38ba8"
swap_color = "#fab387"
gpu_colors = ["#74c7ec","#cba6f7","#f38ba8","#fab387","#f9e2af","#a6e3a1"]
arc_color = "#89dceb"
[styles.network]
rx_color = "#a6e3a1"
tx_color = "#f38ba8"
rx_total_color = "#89dceb"
tx_total_color = "#a6e3a1"
[styles.battery]
high_battery_color = "#a6e3a1"
medium_battery_color = "#f9e2af"
low_battery_color = "#f38ba8"
[styles.tables]
headers = {color = "#f5e0dc"}
[styles.graphs]
graph_color = "#a6adc8"
legend_text = {color = "#a6adc8"}
[styles.widgets]
border_color = "#585b70"
selected_border_color = "#f5c2e7"
widget_title = {color = "#f2cdcd"}
text = {color = "#cdd6f4"}
selected_text = {color = "#11111b", bg_color = "#cba6f7"}
disabled_text = {color = "#1e1e2e"}

