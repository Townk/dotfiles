# Zellij custom plugin manifest — single source of truth shared by:
#   - dot_config/zellij/config.kdl.tmpl            (the `location=` each alias resolves to)
#   - dot_config/zellij/executable_ensure-plugins.tmpl  (downloads the managed wasms)
#   - .chezmoiscripts/run_after_45-grant-zellij-plugin-permissions.sh.tmpl (grants by resolved path)
#
# Resolution policy lives in .chezmoitemplates/zellij-plugin-path.tmpl. If
# `dev` is true AND a local release wasm exists under
# ~/Projects/apps/zellij/<repoName>/target/wasm32-wasip1/release/, the plugin
# loads from that build; otherwise it loads from ~/.local/share/zellij/plugins/
# <wasm>, which ensure-plugins fetches from `url`. Nothing uses Zellij's own
# http downloader anymore — it caches transient gateway/CDN errors (404 / 504
# HTML) as the wasm and never retries, which silently breaks the plugin.
#
# Add a plugin: append an entry here. Bump a version: edit its `url`. The
# version lives only in `url` (the managed wasm path is version-less, so the
# permission-cache key and config never need touching for a bump).
zellijPlugins:
  - alias: context-keys
    wasm: zj-context-keys.wasm
    repoName: zj-context-keys
    dev: true
    url: https://github.com/Townk/zj-context-keys/releases/download/v0.1.2/zj-context-keys.wasm
  - alias: prompt-jumper
    wasm: zj-prompt-jumper.wasm
    repoName: zj-prompt-jumper
    dev: true
    url: https://github.com/Townk/zj-prompt-jumper/releases/download/v0.1.2/zj-prompt-jumper.wasm
  - alias: status-bar
    wasm: zj-hud.wasm
    repoName: zj-hud
    dev: true
    url: https://github.com/Townk/zj-hud/releases/download/v0.1.2/zj-hud.wasm
  - alias: vim-navigator
    wasm: vim-zellij-navigator.wasm
    repoName: ""
    dev: false
    url: https://github.com/hiasr/vim-zellij-navigator/releases/download/0.3.0/vim-zellij-navigator.wasm
