# theme.yaml — the single source of truth for color across this config.
#
# chezmoi loads this as template data under `.theme`, visible to every *.tmpl.
# Generated projections (e.g. ~/.config/theme/chezmoi-system.zsh) and templated configs
# read from here, so the palette is defined exactly once. Hex values are stored
# WITHOUT a leading '#': templates add '#', '0x', or split to "R G B" as needed.
#
# Structure (see docs/theme-unification.md):
#   theme.active            the ONE switch — names the palette to render.
#   theme.palettes.<name>   per-theme files; each fills the SAME named vocabulary
#                           plus appearance + the bespoke per-theme sets
#                           (ansi_bright, alternate_bg, tags, tab, dialog).
#   theme.roles             the shared semantic map (CONSTANT across themes); it
#                           references vocabulary slots. Generators read THESE.
#
# Switch the whole system: edit `theme.active`, then `chezmoi apply`.
theme:
  active: catppuccin-mocha

  palettes:
    # ----------------------------------------------------------------------- #
    catppuccin-mocha:
      meta: { name: "Catppuccin Mocha", appearance: dark }

      # Named vocabulary — the Catppuccin slot set (the only place these live).
      rosewater: "f5e0dc"
      flamingo:  "f2cdcd"
      pink:      "f5c2e7"
      mauve:     "cba6f7"
      red:       "f38ba8"
      maroon:    "eba0ac"
      peach:     "fab387"
      yellow:    "f9e2af"
      green:     "a6e3a1"
      teal:      "94e2d5"
      sky:       "89dceb"
      sapphire:  "74c7ec"
      blue:      "89b4fa"
      lavender:  "b4befe"
      text:      "cdd6f4"
      subtext1:  "bac2de"
      subtext0:  "a6adc8"
      overlay2:  "9399b2"
      overlay1:  "7f849c"
      overlay0:  "6c7086"
      surface2:  "585b70"
      surface1:  "45475a"
      surface0:  "313244"
      base:      "1e1e2e"
      mantle:    "181825"
      crust:     "11111b"
      white:     "ffffff"   # pure white (not a Catppuccin slot) — keycaps/hints
      mauve_light: "e2cefb" # light tint of mauve (not a Catppuccin slot) — shimmer partner for the mauve "Thinking" text

      # Bright ANSI variants (terminal slots 9-14): Mocha's official computed-
      # bright accents, brighter than the base accents. Consumed by the generated
      # terminal themes (ghostty); wezterm reuses the base accents instead.
      ansi_bright: { red: "f37799", green: "89d88b", yellow: "ebd391", blue: "74a8fc", magenta: "f2aede", cyan: "6bd7ca" }

      # SSH/window background washes — appearance-aware: a dark theme keeps these
      # near a dark base, a light theme makes them light. The per-machine layer
      # only picks WHICH name a box uses; the active theme supplies the color.
      # Source for the generated tint-palette.toml.
      alternate_bg: { cyan: "1c232f", blue: "1d1f33", amber: "2a241f", teal: "16302b", purple: "241c30", grey: "2a2a32" }

      # macOS Finder tag colors for the yazi mactag plugin — a bespoke, vivid set
      # (brighter than the base accents), consumed via chezmoi-system.lua by yazi.
      tags: { red: "ee7b70", orange: "f5bd5c", yellow: "fbe764", green: "91fc87", blue: "5fa3f8", purple: "cb88f8" }

      # zj-hud status-bar tab chrome (so dialogs/keys match the bar's tabs).
      tab: { bg: "282c41", fg: "9b9fc1", active_bg: "656a83", active_fg: "ffffff" }

      # Dialog "loud" variants — a brighter red and a warmer yellow than the
      # base slots, tuned for filled dialog/button chrome.
      dialog: { danger: "ff5555", warning: "e5bf7b", search_accent: "61afef" }

      # git-diff (delta) highlight — bespoke, appearance-dependent: bright +/-
      # emphasis fg over dark wash bgs, plus line-number fg/bg pairs. A light
      # theme supplies light variants of these.
      diff:
        plus_bg:      "053f1f"
        plus_emph_fg: "2bfa84"
        plus_emph_bg: "00703e"
        minus_bg:      "3e151d"
        minus_emph_fg: "ff878a"
        minus_emph_bg: "9e1125"
        plus_num_fg:  "00be49"
        plus_num_bg:  "04211b"
        minus_num_fg: "ff2e43"
        minus_num_bg: "26141a"

      # pi coding-agent bespoke chrome (appearance-dependent): a terracotta
      # "thinking" accent + tinted tool result backgrounds.
      pi: { thinking: "d77757", tool_success_bg: "1e2e1e", tool_error_bg: "321e1e" }

      # syntax-theme (.tmTheme) find-highlight wash — bespoke, appearance-dependent.
      find_highlight: "3e5767"

      # diffnav's HARDCODED selection/chrome bg (a foreign constant baked
      # into the binary, not a theme choice) — the tm diff lens remaps it
      # to the tab palette via troupe frame --focus-remap.
      diffnav: { selection: "2d2c35" }

    # ----------------------------------------------------------------------- #
    catppuccin-latte:
      meta: { name: "Catppuccin Latte", appearance: light }

      # Named vocabulary — Catppuccin Latte (the LIGHT flavor).
      rosewater: "dc8a78"
      flamingo:  "dd7878"
      pink:      "ea76cb"
      mauve:     "8839ef"
      red:       "d20f39"
      maroon:    "e64553"
      peach:     "fe640b"
      yellow:    "df8e1d"
      green:     "40a02b"
      teal:      "179299"
      sky:       "04a5e5"
      sapphire:  "209fb5"
      blue:      "1e66f5"
      lavender:  "7287fd"
      text:      "4c4f69"
      subtext1:  "5c5f77"
      subtext0:  "6c6f85"
      overlay2:  "7c7f93"
      overlay1:  "8c8fa1"
      overlay0:  "9ca0b0"
      surface2:  "acb0be"
      surface1:  "bcc0cc"
      surface0:  "ccd0da"
      base:      "eff1f5"
      mantle:    "e6e9ef"
      crust:     "dce0e8"
      white:     "11111b"   # max-contrast "key" color — near-black on a light bg
      mauve_light: "b888f5" # light tint of mauve (not a Catppuccin slot) — shimmer partner for the mauve "Thinking" text

      # Brights reuse the base accents (like wezterm), tuned for the light flavor.
      ansi_bright: { red: "d20f39", green: "40a02b", yellow: "df8e1d", blue: "1e66f5", magenta: "ea76cb", cyan: "179299" }

      # Appearance-aware washes: faint LIGHT tints over the light base.
      alternate_bg: { cyan: "e2ecef", blue: "e3e6f3", amber: "f1ece2", teal: "e0ece8", purple: "ebe4f1", grey: "e8e8ec" }

      # Finder tag colors — the latte accents (vivid on a light bg).
      tags: { red: "e64553", orange: "fe640b", yellow: "df8e1d", green: "40a02b", blue: "1e66f5", purple: "8839ef" }

      # zj-hud tab chrome — light surfaces.
      tab: { bg: "ccd0da", fg: "6c6f85", active_bg: "acb0be", active_fg: "4c4f69" }

      # Dialog "loud" variants — latte red / amber.
      dialog: { danger: "d20f39", warning: "df8e1d", search_accent: "1e66f5" }

      # git-diff (delta) — light wash bgs with dark emphasis fg.
      diff:
        plus_bg:      "c6f0d2"
        plus_emph_fg: "0a6b2e"
        plus_emph_bg: "a3e3b7"
        minus_bg:      "f5ccd3"
        minus_emph_fg: "9e1125"
        minus_emph_bg: "f0a8b2"
        plus_num_fg:  "40a02b"
        plus_num_bg:  "dff0e4"
        minus_num_fg: "d20f39"
        minus_num_bg: "f5dde1"

      # pi coding-agent bespoke chrome — light tinted result backgrounds.
      pi: { thinking: "d77757", tool_success_bg: "dff0e4", tool_error_bg: "f5dde1" }

      # syntax-theme find-highlight wash — light blue.
      find_highlight: "b8d4f0"

      # diffnav's HARDCODED selection/chrome bg — same foreign constant on
      # every host theme (see the mocha entry).
      diffnav: { selection: "2d2c35" }

  # ------------------------------------------------------------------------- #
  # Shared semantic map. CONSTANT across themes; every value is a vocabulary
  # slot name resolved against the ACTIVE palette. Generators read THESE roles,
  # never raw slot names like `mauve`, so a theme switch re-colors everything.
  roles:
    ui:
      bg: base
      bg_dim: mantle
      bg_deep: crust
      dialog_bg: mantle           # floating dialog/modal canvas (darker than bg)
      surface: surface0
      surface_hi: surface1
      overlay: overlay0
      muted: overlay1
      fg: text
      fg_dim: subtext1
      accent: mauve
      border: surface2            # resting boxes (fzf, bottom, dialog field)
      border_focus: blue          # active/focused/selected frame
      border_inactive: surface1   # unfocused frame (explicit dim)
      hint: overlay1              # keybind / help hint line
      input_fg: text             # typed input (= fg)
      placeholder: overlay0      # placeholder + autosuggestion ghost
      cursor: rosewater
      cursor_text: base
      selection: surface2
      link: blue
      separator: surface0
      key: white
      title: mauve

    state: { error: red, warning: yellow, success: green, info: sapphire, hint: teal }

    # Action-button INTENTS (one hue each). Apps map their buttons -> an intent;
    # the theme never names per-app actions. run/confirm intentionally share
    # green (both positive) but stay separate for precise intent + later split.
    action: { primary: mauve, run: green, confirm: green, stop: red,
              caution: peach, attention: yellow, info: sapphire, neutral: overlay1 }

    # Input-state indicators (NOT actions). Reused by zellij modes, p10k vi-mode,
    # nvim mode-line. tmux = "command"; rename covers rename_tab + rename_pane.
    mode: { normal: green, locked: peach, pane: blue, tab: green, resize: mauve,
            move: yellow, search: blue, scroll: lavender, rename: yellow,
            session: red, prompt: red, tmux: red, visual: mauve }

    diff: { added: green, removed: red, changed: peach }

    # Canonical 16-color ANSI (computed-bright style). ghostty/wezterm keep their
    # own slightly different built-in mappings; this is for any new consumer.
    ansi:
      black: surface1
      red: red
      green: green
      yellow: yellow
      blue: blue
      magenta: pink
      cyan: teal
      white: subtext1
      bright_black: surface2
      bright_red: red
      bright_green: green
      bright_yellow: yellow
      bright_blue: blue
      bright_magenta: pink
      bright_cyan: teal
      bright_white: subtext0

    # Canonical syntax map for generated code themes (bat/nvim/delta/rich).
    syntax:
      keyword: mauve
      string: green
      comment: overlay2
      function: blue
      type: yellow
      constant: peach
      number: peach
      operator: teal
      variable: text
      parameter: maroon
      property: teal
      tag: blue
      builtin: red
      punctuation: overlay2
      escape: pink
      heading: red
