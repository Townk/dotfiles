# keymap.yaml — THE authoritative mux keymap (migration Phase 5/5.2).
# Single source for: the generated tmux mode tables (keymap.conf.tmpl), the
# which-key PANEL's own dispatcher + labels (whichkey.data → mux-whichkey),
# and later the zellij KDL (Phase 8). Everything the panel shows and every
# key it dispatches comes from here, so the two can never drift.
#
# entry fields: keys[] (tmux key names; several = variants shown merged,
# e.g. Up + k → "↑,K"), desc, icon, color (palette slot), cmd (tmux command
# line), switch (pushes another mode), sticky (the mode SURVIVES the
# action — motions, focus moves, flag toggles), dialog (opens a popup — the
# panel closes first: popup-in-popup mutates the outer one), panel_exit
# (leaves the panel's world entirely), panel_only (documented here, bound in
# keymap-base.conf — not emitted into keymap.conf).
#
# Two orthogonal questions per entry. WHO RUNS IT: a non-empty cmd is the
# panel's to run; an EMPTY cmd means the PANE owns the key and the panel
# forwards the keystroke to it (the copy-mode motions, whose one real
# binding is the conditional in copy-mode-vi — j is scroll-down in Scroll
# and cursor-down in Copy). WHAT IT DOES TO THE MODE STACK: switch pushes
# `to`, sticky keeps the mode, anything else ends it.
#
# which_key.groups mirrors the zellij layout's `which_key { groups { … } }`:
# each group renders CONTIGUOUSLY in the listed order and is anchored — it
# lands where its FIRST member would sort naturally. Everything else follows
# zj-hud's panel sort: bindings that enter another mode first, then
# unmodified chords alphabetically, then modified ones by (modifier count,
# modifier rank shift<super<alt<ctrl, key).
keymap:
  which_key:
    sort_by: row
    width: single
    max_rows: 25
    margin: 1,2,2,6
    padding: 0,1,0,1
    binding_separator: ➜
    background: dialog_bg
    border: border_focus
    key_color: white
    label_color: pink
    switch_color: blue
    sticky_color: green
    footer_color: overlay0
    dim_color: surface2
    start_hidden:
    - scroll
    # Search comes up over the pane you are reading; the panel would cover
    # the matches. Alt+. raises it (the bar carries the hint meanwhile).
    - search
    toggle_key: M-.
    back_key: BSpace
    next_page_key: C-d
    prev_page_key: C-u
    groups:
    - mode: prefix
      members:
      - L
      - s
      - t
      - p
      - l
      - V
    - mode: prefix
      members:
      - h
      - v
      - f
      - z
    - mode: prefix
      members:
      - u
      - i
      - k
    - mode: prefix
      members:
      - Y
      - M-y
    - mode: prefix
      members:
      - U
      - G
      - c
    - mode: tab
      members:
      - t
      - T
    - mode: tab
      members:
      - '['
      - ']'
      - P
    - mode: tab
      members:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      - '9'
      - '0'
    - mode: pane
      members:
      - p
      - P
    - mode: pane
      members:
      - K
      - S-Up
      - J
      - S-Down
      - H
      - S-Left
      - L
      - S-Right
    - mode: pane
      members:
      - f
      - z
    - mode: session
      members:
      - s
      - S
    - mode: scroll
      members: &id001
      - Up
      - k
      - Down
      - j
      - C-u
      - C-d
      - C-b
      - PageUp
      - C-f
      - PageDown
      - g
      - Home
      - G
      - End
    - mode: copy
      members:
      - Up
      - k
      - Down
      - j
      - Left
      - h
      - Right
      - l
    - mode: copy
      members:
      - C-u
      - C-d
      - C-b
      - PageUp
      - C-f
      - PageDown
      - g
      - Home
      - G
      - End
    - mode: search
      members:
      - n
      - N
    - mode: search
      members:
      - M-c
      - M-b
      - M-p
    - mode: search
      members: *id001
    # states: what the MODE STACK pushes. `table` is the PANEL table whose
    # bindings the which-key panel lists (empty = the state has no panel);
    # `key_table` is the tmux key table the state arms (empty = root — the
    # copy-mode states are dispatched by copy-mode-vi, and `prefix` is armed
    # one-shot with switch-client). lib/mux/stack.zsh derives both from here,
    # so "which table am I in" has exactly one answer.
    states:
      command:
        title: Command
        icon: 󰘳
        color: tmux
        table: prefix
        parent: ''
        key_table: 'prefix'
      tab:
        title: Tab
        icon: 󰓩
        color: tab
        table: tab
        parent: command
        key_table: 'tab'
      pane:
        title: Pane
        icon: 
        color: pane
        table: pane
        parent: command
        key_table: 'pane'
      session:
        title: Session
        icon: 󰙀
        color: session
        table: session
        parent: command
        key_table: 'session'
      resize:
        title: Resize
        icon: 󰩨
        color: resize
        table: resize
        parent: pane
        key_table: 'resize'
      move:
        title: Move
        icon: 󰙕
        color: move
        table: move
        parent: pane
        key_table: 'move'
      locked:
        title: Locked
        icon: 󰌾
        color: locked
        table: ''
        parent: ''
        key_table: 'locked'
      nested:
        title: Nested
        icon: 󰌾
        color: locked
        table: ''
        parent: ''
        key_table: 'nested'
      scroll:
        title: Scroll
        icon: 󰩤
        color: scroll
        table: scroll
        parent: command
        key_table: ''
      copy:
        title: Copy
        icon: 󰆏
        color: visual
        table: copy
        parent: scroll
        key_table: ''
      search:
        title: Search
        icon: 
        color: search
        table: search
        parent: scroll
        key_table: ''
      rename:
        title: Rename
        icon: 󰑕
        color: rename
        # No panel table ON PURPOSE. Rename's UI is its dialog, and the mode
        # stack's driver owns exactly one popup: a stackable rename made the
        # driver close the dialog microseconds after opening it (the entry is
        # pushed hidden, and sync closes popups for a hidden top). The MODE is
        # real where it is visible — the ribbon reads @renaming and wears the
        # pill and the key hints — without a second popup owner.
        table: ''
        parent: ''
        key_table: ''
  tables:
    prefix:
      title: Command
      icon: 󰘳
      color: red
      entries:
      - keys:
        - L
        desc: Locked mode …
        icon: 󰌾
        color: peach
        cmd: set key-table locked
        switch: true
        panel_exit: true
        to: locked
      - keys:
        - s
        desc: Session mode …
        icon: 󰙀
        color: red
        cmd: set key-table session
        switch: true
        to: session
      - keys:
        - t
        desc: Tab mode …
        icon: 󰓩
        color: green
        cmd: set key-table tab
        switch: true
        to: tab
      - keys:
        - p
        desc: Pane mode …
        icon: 
        color: blue
        cmd: set key-table pane
        switch: true
        to: pane
      - keys:
        - l
        desc: Scroll mode …
        icon: 󰩤
        color: lavender
        cmd: set -p @visual 0 ; copy-mode
        switch: true
        panel_exit: true
        to: scroll
      - keys:
        - V
        desc: Copy mode …
        icon: 󰆏
        color: mauve
        cmd: set -p @visual 1 ; copy-mode
        switch: true
        panel_exit: true
        to: copy
      - keys:
        - ','
        desc: terminal settings
        icon: 
        color: teal
        cmd: run-shell 'zsh ~/.config/mux/scripts/edit-terminal-config'
      - keys:
        - q
        desc: kill current session
        icon: 󰈆
        color: red
        cmd: display-popup -E -B -w 52 -h 13 -e 'COLORTERM=truecolor' '$HOME/.config/mux/scripts/tmux-modal -- $HOME/.config/mux/scripts/mux-quit-confirm'
        dialog: true
      - keys:
        - h
        desc: split pane (horiz)
        icon: 
        color: blue
        cmd: split-window -v -c "#{pane_current_path}"
      - keys:
        - v
        desc: split pane (vert)
        icon: 
        color: blue
        cmd: split-window -h -c "#{pane_current_path}"
      - keys:
        - f
        desc: toggle pane borders
        icon: 󰃇
        color: blue
        cmd: if -F '#{==:#{pane-border-status},off}' 'setw -g pane-border-status top' 'setw -g pane-border-status off'
        sticky: true
      - keys:
        - z
        desc: toggle pane zoom
        icon: 󱀅
        color: blue
        cmd: resize-pane -Z
      - keys:
        - u
        desc: alarm on updated
        icon: 󰂞
        color: yellow
        cmd: 'setw monitor-activity on ; display ''alarm: activity'''
      - keys:
        - i
        desc: alarm on idle
        icon: 󰂠
        color: yellow
        cmd: 'setw monitor-silence 30 ; display ''alarm: idle 30s'''
      - keys:
        - k
        desc: cancel all alarms
        icon: 󰂛
        color: yellow
        cmd: setw monitor-silence 0 ; setw monitor-activity off ; display 'alarms cleared'
      - keys:
        - U
        desc: glyph picker (repeat)
        icon: 󰥸
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor -e PICK_GLYPH_PADDING=0,2,0,2 "$HOME/.config/mux/scripts/tmux-modal --title \"Glyph Picker (resumed)\"
          --inject --no-chrome -- $HOME/.local/libexec/pick-glyph --resume"'
        dialog: true
      - keys:
        - G
        desc: gitmoji picker (repeat)
        icon: 󰥸
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor -e PICK_GITMOJI_PADDING=0,2,0,2 "$HOME/.config/mux/scripts/tmux-modal --title \"Gitmoji Picker (resumed)\"
          --inject --no-chrome -- $HOME/.local/libexec/pick-gitmoji --resume"'
        dialog: true
      - keys:
        - c
        desc: clipboard history
        icon: 󱛢
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 75 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Clipboard history\" --inject --no-chrome -- $HOME/.local/libexec/pick-clipboard"'
        dialog: true
      - keys:
        - Y
        desc: copy pwd
        icon: 󰅇
        color: yellow
        cmd: 'run-shell ''zsh ~/.config/mux/scripts/copy-pwd --relative #{pane_pid}'''
      - keys:
        - M-y
        desc: copy pwd (abs)
        icon: 󰅇
        color: yellow
        cmd: 'run-shell ''zsh ~/.config/mux/scripts/copy-pwd --absolute #{pane_pid}'''
    tab:
      title: Tab
      icon: 󰓩
      color: green
      parent: prefix
      entries:
      - keys:
        - r
        desc: Rename Tab …
        icon: 
        color: yellow
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/mux-rename --launch window'
        switch: true
        dialog: true
        to: rename
      - keys:
        - t
        desc: new tab
        icon: 󰝜
        color: mauve
        cmd: new-window -c "#{pane_current_path}" ; set key-table root
      - keys:
        - T
        desc: quick launch new tab
        icon: 󱓞
        color: mauve
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Tab\" --no-chrome --
          $HOME/.config/mux/scripts/quick-launch menu tab"'
        dialog: true
      - keys:
        - x
        desc: close tab
        icon: 󰱞
        color: red
        cmd: kill-window ; set key-table root
      - keys:
        - Left
        - h
        desc: previous tab
        icon: 󰅁
        color: teal
        cmd: previous-window
        sticky: true
      - keys:
        - Right
        - l
        desc: next tab
        icon: 󰅂
        color: teal
        cmd: next-window
        sticky: true
      - keys:
        - Tab
        desc: last focused tab
        icon: 󰄹
        color: teal
        cmd: last-window
        sticky: true
      - keys:
        - '1'
        desc: go to tab 1
        icon: 󰎠
        color: teal
        cmd: select-window -t :=1 ; set key-table root
      - keys:
        - '2'
        desc: go to tab 2
        icon: 󰎠
        color: teal
        cmd: select-window -t :=2 ; set key-table root
      - keys:
        - '3'
        desc: go to tab 3
        icon: 󰎠
        color: teal
        cmd: select-window -t :=3 ; set key-table root
      - keys:
        - '4'
        desc: go to tab 4
        icon: 󰎠
        color: teal
        cmd: select-window -t :=4 ; set key-table root
      - keys:
        - '5'
        desc: go to tab 5
        icon: 󰎠
        color: teal
        cmd: select-window -t :=5 ; set key-table root
      - keys:
        - '6'
        desc: go to tab 6
        icon: 󰎠
        color: teal
        cmd: select-window -t :=6 ; set key-table root
      - keys:
        - '7'
        desc: go to tab 7
        icon: 󰎠
        color: teal
        cmd: select-window -t :=7 ; set key-table root
      - keys:
        - '8'
        desc: go to tab 8
        icon: 󰎠
        color: teal
        cmd: select-window -t :=8 ; set key-table root
      - keys:
        - '9'
        desc: go to tab 9
        icon: 󰎠
        color: teal
        cmd: select-window -t :=9 ; set key-table root
      - keys:
        - '0'
        desc: go to tab 10
        icon: 󰎠
        color: teal
        cmd: select-window -t :=10 ; set key-table root
      - keys:
        - '['
        desc: tab to pane at left
        icon: 󰮹
        color: green
        cmd: join-pane -h -t :-1 ; set key-table root
      - keys:
        - ']'
        desc: tab to pane at right
        icon: 󰮺
        color: green
        cmd: join-pane -h -t :+1 ; set key-table root
      - keys:
        - P
        desc: pane to tab
        icon: 
        color: green
        cmd: break-pane ; set key-table root
      - keys:
        - s
        desc: sync input all panes
        icon: 
        color: blue
        cmd: setw synchronize-panes ; set key-table root
    pane:
      title: Pane
      icon: 
      color: blue
      parent: prefix
      entries:
      - keys:
        - m
        desc: Move Pane …
        icon: 󰆾
        color: yellow
        cmd: set key-table move
        switch: true
        to: move
      - keys:
        - r
        desc: Rename Pane …
        icon: 
        color: yellow
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/mux-rename --launch pane'
        switch: true
        dialog: true
        to: rename
      - keys:
        - s
        desc: Resize Pane …
        icon: 󰩨
        color: mauve
        cmd: set key-table resize
        switch: true
        to: resize
      - keys:
        - Up
        - k
        desc: focus up
        icon: 
        color: teal
        cmd: select-pane -U
        sticky: true
      - keys:
        - Down
        - j
        desc: focus down
        icon: 
        color: teal
        cmd: select-pane -D
        sticky: true
      - keys:
        - Left
        - h
        desc: focus left
        icon: 
        color: teal
        cmd: select-pane -L
        sticky: true
      - keys:
        - Right
        - l
        desc: focus right
        icon: 
        color: teal
        cmd: select-pane -R
        sticky: true
      - keys:
        - Tab
        desc: switch focus
        icon: 
        color: teal
        cmd: select-pane -t :.+
        sticky: true
      - keys:
        - f
        desc: toggle pane borders
        icon: 󰃇
        color: blue
        cmd: if -F '#{==:#{pane-border-status},off}' 'setw -g pane-border-status top' 'setw -g pane-border-status off'
        sticky: true
      - keys:
        - z
        desc: toggle pane zoom
        icon: 󱀅
        color: blue
        cmd: resize-pane -Z ; set key-table root
      - keys:
        - x
        desc: close pane
        icon: 󰅘
        color: red
        cmd: kill-pane ; set key-table root
      - keys:
        - S-Up
        - K
        desc: split pane up
        icon: 
        color: mauve
        cmd: split-window -vb -c "#{pane_current_path}" ; set key-table root
      - keys:
        - S-Down
        - J
        desc: split pane down
        icon: 
        color: mauve
        cmd: split-window -v -c "#{pane_current_path}" ; set key-table root
      - keys:
        - S-Left
        - H
        desc: split pane left
        icon: 
        color: mauve
        cmd: split-window -hb -c "#{pane_current_path}" ; set key-table root
      - keys:
        - S-Right
        - L
        desc: split pane right
        icon: 
        color: mauve
        cmd: split-window -h -c "#{pane_current_path}" ; set key-table root
      - keys:
        - p
        desc: new pane
        icon: 󰯌
        color: green
        cmd: split-window -c "#{pane_current_path}" ; set key-table root
      - keys:
        - P
        desc: quick launch new pane
        icon: 󱓞
        color: green
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 70 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Pane\" --no-chrome
          -- $HOME/.config/mux/scripts/quick-launch menu pane"'
        dialog: true
    resize:
      title: Resize
      icon: 󰩨
      color: mauve
      parent: pane
      entries:
      - keys:
        - Up
        - k
        desc: grow up
        icon: 󰅃
        color: teal
        cmd: resize-pane -U 2
        sticky: true
      - keys:
        - Down
        - j
        desc: grow down
        icon: 󰅀
        color: teal
        cmd: resize-pane -D 2
        sticky: true
      - keys:
        - Left
        - h
        desc: grow left
        icon: 󰅁
        color: teal
        cmd: resize-pane -L 2
        sticky: true
      - keys:
        - Right
        - l
        desc: grow right
        icon: 󰅂
        color: teal
        cmd: resize-pane -R 2
        sticky: true
      - keys:
        - +
        desc: grow
        icon: 󰐕
        color: teal
        cmd: resize-pane -U 2
        sticky: true
      - keys:
        - '-'
        desc: shrink
        icon: 󰍴
        color: teal
        cmd: resize-pane -D 2
        sticky: true
    move:
      title: Move
      icon: 󰙕
      color: yellow
      parent: pane
      entries:
      - keys:
        - Down
        - j
        desc: swap pane down
        icon: 󰅀
        color: teal
        cmd: swap-pane -D
        sticky: true
      - keys:
        - Up
        - k
        desc: swap pane up
        icon: 󰅃
        color: teal
        cmd: swap-pane -U
        sticky: true
      - keys:
        - Left
        - h
        desc: rotate window up
        icon: 󰅁
        color: teal
        cmd: rotate-window -U
        sticky: true
      - keys:
        - Right
        - l
        desc: rotate window down
        icon: 󰅂
        color: teal
        cmd: rotate-window -D
        sticky: true
      - keys:
        - Tab
        desc: swap with next
        icon: 󰄹
        color: teal
        cmd: swap-pane -D
        sticky: true
    session:
      title: Session
      icon: 󰙀
      color: red
      parent: prefix
      entries:
      - keys:
        - d
        desc: detach
        icon: 󱟃
        color: red
        cmd: detach-client
      - keys:
        - r
        desc: Rename Session …
        icon: 󰑕
        color: yellow
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/mux-rename --launch session'
        switch: true
        dialog: true
        to: rename
      - keys:
        - s
        desc: new session
        icon: 󰝜
        color: mauve
        cmd: run-shell -b "$HOME/.config/mux/scripts/mux-new-session '#{client_tty}' '#{pane_current_path}'" ; set key-table root
      - keys:
        - w
        desc: session manager
        icon: 󰧨
        color: red
        cmd: choose-tree -Zs ; set key-table root
        dialog: true
      - keys:
        - S
        desc: quick launch session
        icon: 󱓟
        color: red
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Session\" --no-chrome
          -- $HOME/.config/mux/scripts/quick-launch menu workspace"'
        dialog: true
    scroll:
      title: Scroll
      icon: 󰩤
      color: lavender
      parent: prefix
      table: copy-mode-vi
      entries:
      - keys:
        - /
        desc: Search scroll buffer …
        icon: 
        color: blue
        cmd: run-shell -b "$HOME/.config/mux/scripts/mux-search --launch"
        panel_only: true
        switch: true
        to: search
        dialog: true
      - keys:
        - v
        desc: Copy mode …
        icon: 󰆏
        color: mauve
        cmd: ''
        panel_only: true
        switch: true
        to: copy
      - keys:
        - V
        desc: edit scrollback
        icon: 
        color: peach
        cmd: ''
        panel_only: true
      - keys:
        - f
        - n
        desc: next prompt
        sticky: true
        icon: 
        color: mauve
        cmd: ''
        panel_only: true
      - keys:
        - b
        - N
        desc: previous prompt
        sticky: true
        icon: 
        color: mauve
        cmd: ''
        panel_only: true
      - &id008
        keys:
        - Up
        - k
        desc: scroll up
        sticky: true
        icon: 󰅃
        color: teal
        cmd: ''
        panel_only: true
      - &id009
        keys:
        - Down
        - j
        desc: scroll down
        sticky: true
        icon: 󰅀
        color: teal
        cmd: ''
        panel_only: true
      - &id002
        keys:
        - C-u
        desc: half page scroll up
        sticky: true
        icon: 󰄿
        color: teal
        cmd: ''
        panel_only: true
      - &id003
        keys:
        - C-d
        desc: half page scroll down
        sticky: true
        icon: 󰄼
        color: teal
        cmd: ''
        panel_only: true
      - &id004
        keys:
        - C-b
        - PageUp
