# keymap.yaml — THE authoritative mux keymap (migration Phase 5/5.2).
# Single source for: the generated tmux mode tables (keymap.conf.tmpl), the
# which-key PANEL's own dispatcher + labels (whichkey.data → mux-whichkey),
# and later the zellij KDL (Phase 8). Everything the panel shows and every
# key it dispatches comes from here, so the two can never drift.
#
# entry fields: keys[] (tmux key names; several = variants shown merged,
# e.g. Up + k → "↑,K"), desc, icon, color (palette slot), cmd (tmux command
# line), switch (pushes another mode), stay (mode survives the action),
# dialog (opens a popup — the panel closes first: popup-in-popup mutates
# the outer one), panel_exit (leaves the panel's world entirely),
# panel_only (documented here, bound in keymap-base.conf).
#
# which_key.groups mirrors the zellij layout's `which_key { groups { … } }`:
# each group renders CONTIGUOUSLY in the listed order and is anchored — it
# lands where its FIRST member would sort naturally. Everything else follows
# zj-hud's panel sort: bindings that enter another mode first, then
# unmodified chords alphabetically, then modified ones by (modifier count,
# modifier rank shift<super<alt<ctrl, key).
keymap:
  which_key:
    sort_by: row
    width: single
    max_rows: 25
    margin: 1,2,2,6
    padding: 0,1,0,1
    binding_separator: ➜
    background: dialog_bg
    border: border_focus
    key_color: white
    label_color: pink
    switch_color: blue
    footer_color: overlay0
    dim_color: surface2
    start_hidden:
    - scroll
    toggle_key: M-.
    back_key: BSpace
    next_page_key: C-d
    prev_page_key: C-u
    groups:
    - mode: prefix
      members:
      - L
      - o
      - t
      - p
      - l
      - V
    - mode: prefix
      members:
      - s
      - v
      - f
      - z
    - mode: prefix
      members:
      - u
      - i
      - k
    - mode: prefix
      members:
      - Y
      - M-y
    - mode: prefix
      members:
      - U
      - G
      - c
    - mode: tab
      members:
      - '['
      - ']'
      - P
    - mode: tab
      members:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      - '9'
      - '0'
    - mode: pane
      members:
      - K
      - S-Up
      - J
      - S-Down
      - H
      - S-Left
      - L
      - S-Right
    - mode: pane
      members:
      - f
      - z
    - mode: copy
      members:
      - n
      - N
    - mode: copy
      members:
      - M-c
      - M-b
      - M-p
    - mode: copy
      members:
      - Up
      - k
      - Down
      - j
      - C-u
      - C-d
      - C-b
      - PageUp
      - C-f
      - PageDown
      - g
      - Home
      - G
      - End
    states:
      command:
        title: Command
        icon: 󰘳
        color: tmux
        table: prefix
        parent: ''
      tab:
        title: Tab
        icon: 󰓩
        color: tab
        table: tab
        parent: command
      pane:
        title: Pane
        icon: 
        color: pane
        table: pane
        parent: command
      session:
        title: Session
        icon: 󰙀
        color: session
        table: session
        parent: command
      resize:
        title: Resize
        icon: 󰩨
        color: resize
        table: resize
        parent: pane
      move:
        title: Move
        icon: 󰙕
        color: move
        table: move
        parent: pane
      locked:
        title: Locked
        icon: 󰌾
        color: locked
        table: ''
        parent: ''
      nested:
        title: Nested
        icon: 󰌾
        color: locked
        table: ''
        parent: ''
      scroll:
        title: Scroll
        icon: 󰩤
        color: scroll
        table: copy
        parent: command
      copy:
        title: Copy
        icon: 󰆏
        color: visual
        table: copy
        parent: scroll
      search:
        title: Search
        icon: 
        color: search
        table: copy
        parent: scroll
      rename:
        title: Rename
        icon: 󰑕
        color: rename
        table: ''
        parent: ''
  tables:
    prefix:
      title: Command
      icon: 󰘳
      color: red
      entries:
      - keys:
        - L
        desc: Locked mode …
        icon: 󰌾
        color: peach
        cmd: set key-table locked
        switch: true
        panel_exit: true
      - keys:
        - o
        desc: Session mode …
        icon: 󰙀
        color: red
        cmd: set key-table session
        switch: true
      - keys:
        - t
        desc: Tab mode …
        icon: 󰓩
        color: green
        cmd: set key-table tab
        switch: true
      - keys:
        - p
        desc: Pane mode …
        icon: 
        color: blue
        cmd: set key-table pane
        switch: true
      - keys:
        - l
        desc: Scroll mode …
        icon: 󰩤
        color: lavender
        cmd: set -p @visual 0 ; copy-mode
        switch: true
        panel_exit: true
      - keys:
        - V
        desc: Copy mode …
        icon: 󰆏
        color: mauve
        cmd: set -p @visual 1 ; set -p @copy_parent command ; copy-mode
        switch: true
        panel_exit: true
      - keys:
        - ','
        desc: terminal settings
        icon: 
        color: teal
        cmd: run-shell 'zsh ~/.config/zellij/scripts/edit-terminal-config'
      - keys:
        - q
        desc: kill current session
        icon: 󰈆
        color: red
        cmd: display-popup -E -B -w 52 -h 13 -e 'COLORTERM=truecolor' '$HOME/.config/mux/scripts/tmux-modal -- $HOME/.config/mux/scripts/mux-quit-confirm'
        dialog: true
      - keys:
        - s
        desc: split pane (horiz)
        icon: 
        color: blue
        cmd: split-window -v
      - keys:
        - v
        desc: split pane (vert)
        icon: 
        color: blue
        cmd: split-window -h
      - keys:
        - f
        desc: toggle pane borders
        icon: 󰃇
        color: blue
        cmd: if -F '#{==:#{pane-border-status},off}' 'setw -g pane-border-status top' 'setw -g pane-border-status off'
        stay: true
      - keys:
        - z
        desc: toggle pane zoom
        icon: 󱀅
        color: blue
        cmd: resize-pane -Z
      - keys:
        - u
        desc: alarm on updated
        icon: 󰂞
        color: yellow
        cmd: 'setw monitor-activity on ; display ''alarm: activity'''
      - keys:
        - i
        desc: alarm on idle
        icon: 󰂠
        color: yellow
        cmd: 'setw monitor-silence 30 ; display ''alarm: idle 30s'''
      - keys:
        - k
        desc: cancel all alarms
        icon: 󰂛
        color: yellow
        cmd: setw monitor-silence 0 ; setw monitor-activity off ; display 'alarms cleared'
      - keys:
        - U
        desc: glyph picker (repeat)
        icon: 󰥸
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor -e PICK_GLYPH_PADDING=0,2,0,2 "$HOME/.config/mux/scripts/tmux-modal --title \"Glyph Picker (resumed)\"
          --inject --no-chrome -- $HOME/.local/libexec/pick-glyph --resume"'
        dialog: true
      - keys:
        - G
        desc: gitmoji picker (repeat)
        icon: 󰥸
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor -e PICK_GITMOJI_PADDING=0,2,0,2 "$HOME/.config/mux/scripts/tmux-modal --title \"Gitmoji Picker (resumed)\"
          --inject --no-chrome -- $HOME/.local/libexec/pick-gitmoji --resume"'
        dialog: true
      - keys:
        - c
        desc: clipboard history
        icon: 󱛢
        color: mauve
        cmd: run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 75 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Clipboard history\" --inject --no-chrome -- $HOME/.local/libexec/pick-clipboard"'
        dialog: true
      - keys:
        - Y
        desc: copy pwd
        icon: 󰅇
        color: yellow
        cmd: 'run-shell ''zsh ~/.config/zellij/scripts/copy-pwd --relative #{pane_pid}'''
      - keys:
        - M-y
        desc: copy pwd (abs)
        icon: 󰅇
        color: yellow
        cmd: 'run-shell ''zsh ~/.config/zellij/scripts/copy-pwd --absolute #{pane_pid}'''
    tab:
      title: Tab
      icon: 󰓩
      color: green
      parent: prefix
      entries:
      - keys:
        - n
        desc: Rename Tab …
        icon: 󰑕
        color: yellow
        cmd: set key-table root ; display-popup -E -B -w 66 -h 13 -e 'COLORTERM=truecolor' '$HOME/.config/mux/scripts/tmux-modal -- $HOME/.config/mux/scripts/mux-rename window'
        switch: true
        dialog: true
      - keys:
        - N
        desc: new tab
        icon: 󰝜
        color: mauve
        cmd: new-window ; set key-table root
      - keys:
        - T
        desc: quick launch new tab
        icon: 󰓞
        color: mauve
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Tab\" --no-chrome --
          $HOME/.config/zellij/scripts/quick-launch menu tab"'
        dialog: true
      - keys:
        - x
        desc: close tab
        icon: 󰱞
        color: red
        cmd: kill-window ; set key-table root
      - keys:
        - Left
        - h
        desc: previous tab
        icon: 󰅁
        color: teal
        cmd: previous-window
        stay: true
      - keys:
        - Right
        - l
        desc: next tab
        icon: 󰅂
        color: teal
        cmd: next-window
        stay: true
      - keys:
        - Tab
        desc: last focused tab
        icon: 󰄹
        color: teal
        cmd: last-window
        stay: true
      - keys:
        - '1'
        desc: go to tab 1
        icon: 󰎠
        color: teal
        cmd: select-window -t :=1 ; set key-table root
      - keys:
        - '2'
        desc: go to tab 2
        icon: 󰎠
        color: teal
        cmd: select-window -t :=2 ; set key-table root
      - keys:
        - '3'
        desc: go to tab 3
        icon: 󰎠
        color: teal
        cmd: select-window -t :=3 ; set key-table root
      - keys:
        - '4'
        desc: go to tab 4
        icon: 󰎠
        color: teal
        cmd: select-window -t :=4 ; set key-table root
      - keys:
        - '5'
        desc: go to tab 5
        icon: 󰎠
        color: teal
        cmd: select-window -t :=5 ; set key-table root
      - keys:
        - '6'
        desc: go to tab 6
        icon: 󰎠
        color: teal
        cmd: select-window -t :=6 ; set key-table root
      - keys:
        - '7'
        desc: go to tab 7
        icon: 󰎠
        color: teal
        cmd: select-window -t :=7 ; set key-table root
      - keys:
        - '8'
        desc: go to tab 8
        icon: 󰎠
        color: teal
        cmd: select-window -t :=8 ; set key-table root
      - keys:
        - '9'
        desc: go to tab 9
        icon: 󰎠
        color: teal
        cmd: select-window -t :=9 ; set key-table root
      - keys:
        - '0'
        desc: go to tab 10
        icon: 󰎠
        color: teal
        cmd: select-window -t :=10 ; set key-table root
      - keys:
        - '['
        desc: tab to pane at left
        icon: 󰮹
        color: green
        cmd: join-pane -h -t :-1 ; set key-table root
      - keys:
        - ']'
        desc: tab to pane at right
        icon: 󰮺
        color: green
        cmd: join-pane -h -t :+1 ; set key-table root
      - keys:
        - P
        desc: pane to tab
        icon: 
        color: green
        cmd: break-pane ; set key-table root
      - keys:
        - s
        desc: sync input all panes
        icon: 
        color: blue
        cmd: setw synchronize-panes ; set key-table root
    pane:
      title: Pane
      icon: 
      color: blue
      parent: prefix
      entries:
      - keys:
        - m
        desc: Move Pane …
        icon: 󰙕
        color: yellow
        cmd: set key-table move
        switch: true
      - keys:
        - n
        desc: Rename Pane …
        icon: 󰑕
        color: yellow
        cmd: set key-table root ; display-popup -E -B -w 66 -h 13 -e 'COLORTERM=truecolor' '$HOME/.config/mux/scripts/tmux-modal -- $HOME/.config/mux/scripts/mux-rename pane'
        switch: true
        dialog: true
      - keys:
        - r
        desc: Resize Pane …
        icon: 󰩨
        color: mauve
        cmd: set key-table resize
        switch: true
      - keys:
        - Up
        - k
        desc: focus up
        icon: 
        color: teal
        cmd: select-pane -U
        stay: true
      - keys:
        - Down
        - j
        desc: focus down
        icon: 
        color: teal
        cmd: select-pane -D
        stay: true
      - keys:
        - Left
        - h
        desc: focus left
        icon: 
        color: teal
        cmd: select-pane -L
        stay: true
      - keys:
        - Right
        - l
        desc: focus right
        icon: 
        color: teal
        cmd: select-pane -R
        stay: true
      - keys:
        - Tab
        desc: switch focus
        icon: 
        color: teal
        cmd: select-pane -t :.+
        stay: true
      - keys:
        - f
        desc: toggle pane borders
        icon: 󰃇
        color: blue
        cmd: if -F '#{==:#{pane-border-status},off}' 'setw -g pane-border-status top' 'setw -g pane-border-status off'
        stay: true
      - keys:
        - z
        desc: toggle pane zoom
        icon: 󱀅
        color: blue
        cmd: resize-pane -Z ; set key-table root
      - keys:
        - x
        desc: close pane
        icon: 󰅘
        color: red
        cmd: kill-pane ; set key-table root
      - keys:
        - S-Up
        - K
        desc: split pane up
        icon: 
        color: mauve
        cmd: split-window -vb ; set key-table root
      - keys:
        - S-Down
        - J
        desc: split pane down
        icon: 
        color: mauve
        cmd: split-window -v ; set key-table root
      - keys:
        - S-Left
        - H
        desc: split pane left
        icon: 
        color: mauve
        cmd: split-window -hb ; set key-table root
      - keys:
        - S-Right
        - L
        desc: split pane right
        icon: 
        color: mauve
        cmd: split-window -h ; set key-table root
      - keys:
        - N
        desc: new pane
        icon: 󰯌
        color: green
        cmd: split-window ; set key-table root
      - keys:
        - P
        desc: quick launch new pane
        icon: 󰓞
        color: green
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 70 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Pane\" --no-chrome
          -- $HOME/.config/zellij/scripts/quick-launch menu pane"'
        dialog: true
    resize:
      title: Resize
      icon: 󰩨
      color: mauve
      parent: pane
      entries:
      - keys:
        - Up
        - k
        desc: grow up
        icon: 󰅃
        color: teal
        cmd: resize-pane -U 2
        stay: true
      - keys:
        - Down
        - j
        desc: grow down
        icon: 󰅀
        color: teal
        cmd: resize-pane -D 2
        stay: true
      - keys:
        - Left
        - h
        desc: grow left
        icon: 󰅁
        color: teal
        cmd: resize-pane -L 2
        stay: true
      - keys:
        - Right
        - l
        desc: grow right
        icon: 󰅂
        color: teal
        cmd: resize-pane -R 2
        stay: true
      - keys:
        - +
        desc: grow
        icon: 󰐕
        color: teal
        cmd: resize-pane -U 2
        stay: true
      - keys:
        - '-'
        desc: shrink
        icon: 󰍴
        color: teal
        cmd: resize-pane -D 2
        stay: true
    move:
      title: Move
      icon: 󰙕
      color: yellow
      parent: pane
      entries:
      - keys:
        - Down
        - j
        desc: swap pane down
        icon: 󰅀
        color: teal
        cmd: swap-pane -D
        stay: true
      - keys:
        - Up
        - k
        desc: swap pane up
        icon: 󰅃
        color: teal
        cmd: swap-pane -U
        stay: true
      - keys:
        - Left
        - h
        desc: rotate window up
        icon: 󰅁
        color: teal
        cmd: rotate-window -U
        stay: true
      - keys:
        - Right
        - l
        desc: rotate window down
        icon: 󰅂
        color: teal
        cmd: rotate-window -D
        stay: true
      - keys:
        - Tab
        desc: swap with next
        icon: 󰄹
        color: teal
        cmd: swap-pane -D
        stay: true
    session:
      title: Session
      icon: 󰙀
      color: red
      parent: prefix
      entries:
      - keys:
        - d
        desc: detach
        icon: 󱟃
        color: red
        cmd: detach-client
      - keys:
        - w
        desc: session manager
        icon: 󰧨
        color: red
        cmd: choose-tree -Zs ; set key-table root
        dialog: true
      - keys:
        - S
        desc: quick launch session
        icon: 󰓟
        color: red
        cmd: set key-table root ; run-shell -b '$HOME/.config/mux/scripts/tmux-popup 70 60 -E -B -e COLORTERM=truecolor "$HOME/.config/mux/scripts/tmux-modal --title \"Quick Launch — Workspace\" --no-chrome
          -- $HOME/.config/zellij/scripts/quick-launch menu workspace"'
        dialog: true
    copy:
      title: Scroll
      icon: 󰩤
      color: lavender
      parent: prefix
      table: copy-mode-vi
      entries:
      - keys:
        - /
        desc: Search scroll buffer …
        icon: 
        color: blue
        cmd: ''
        switch: true
        panel_only: true
      - keys:
        - v
        desc: copy mode / select
        icon: 󰆏
        color: mauve
        cmd: ''
        panel_only: true
      - keys:
        - V
        desc: edit scrollback
        icon: 
        color: peach
        cmd: ''
        panel_only: true
      - keys:
        - y
        desc: yank selection
        icon: 󰆏
        color: yellow
        cmd: ''
        panel_only: true
      - keys:
        - n
        desc: next match / prompt
        icon: 
        color: mauve
        cmd: ''
        panel_only: true
      - keys:
        - N
        desc: previous match / prompt
        icon: 
        color: mauve
        cmd: ''
        panel_only: true
      - keys:
        - M-c
        desc: toggle case sensitive
        icon: 
        color: yellow
        cmd: ''
        panel_only: true
      - keys:
        - M-b
        desc: toggle word boundaries
        icon: 
        color: yellow
        cmd: ''
        panel_only: true
      - keys:
        - M-p
        desc: toggle line wrap
        icon: 󰕇
        color: yellow
        cmd: ''
        panel_only: true
      - keys:
        - Up
        - k
        desc: scroll up
        icon: 󰅃
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - Down
        - j
        desc: scroll down
        icon: 󰅀
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - C-u
        desc: half page scroll up
        icon: 󰄿
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - C-d
        desc: half page scroll down
        icon: 󰄼
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - C-b
        - PageUp
        desc: page scroll up
        icon: 󰶼
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - C-f
        - PageDown
        desc: page scroll down
        icon: 󰶹
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - g
        - Home
        desc: scroll to top
        icon: 󱥩
        color: teal
        cmd: ''
        panel_only: true
      - keys:
        - G
        - End
        desc: scroll to bottom
        icon: 󱥧
        color: teal
        cmd: ''
        panel_only: true
