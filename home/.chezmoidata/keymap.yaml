# keymap.yaml — the shared mux keymap + which-key label data (migration
# Phase 5, D5 Stage 1). Single source for: the tmux which-key menus
# (menus.conf.tmpl), the deployed ~/.config/mux/keymap.yaml (the future
# tmux-hud's runtime input), and — Phase 5.2/8 — the generated keymap.conf
# and zellij KDL. Colors are PALETTE SLOT NAMES from theme.yaml (hex is
# resolved at template render); icons/descs ported from the zellij
# layout's which_key.labels. `cmd` mirrors keymap.conf verbatim until 5.2
# makes that file generated from here (ratified duplication).
keymap:
  menu_key: "M-."
  tables:
    prefix:
      title: Command
      icon: "󰘳"
      color: red
      entries:
        - { key: L, desc: "Locked mode …", icon: "󰌾", color: peach, cmd: "set key-table locked" }
        - { key: o, desc: "Session mode …", icon: "󰙀", color: red, cmd: "set key-table session" }
        - { key: t, desc: "Tab mode …", icon: "󰓩", color: green, cmd: "set key-table tab" }
        - { key: p, desc: "Pane mode …", icon: "", color: blue, cmd: "set key-table pane" }
        - { key: l, desc: "Scroll mode …", icon: "󰩤", color: lavender, cmd: "set -p @visual 0 ; copy-mode" }
        - { key: V, desc: "copy mode …", icon: "󰆏", color: mauve, cmd: "set -p @visual 1 ; set -p @copy_parent command ; copy-mode" }
        - sep: true
        - { key: s, desc: "split pane (horiz)", icon: "", color: blue, cmd: "split-window -v" }
        - { key: v, desc: "split pane (vert)", icon: "", color: blue, cmd: "split-window -h" }
        - { key: f, desc: "toggle pane borders", icon: "󰃇", color: blue, cmd: "if -F '#{==:#{pane-border-status},off}' 'setw -g pane-border-status top' 'setw -g pane-border-status off'" }
        - { key: z, desc: "toggle pane zoom", icon: "󱀅", color: blue, cmd: "resize-pane -Z" }
        - sep: true
        - { key: u, desc: "alarm on updated", icon: "󰂞", color: yellow, cmd: "setw monitor-activity on ; display 'alarm: activity'" }
        - { key: i, desc: "alarm on idle", icon: "󰂠", color: yellow, cmd: "setw monitor-silence 30 ; display 'alarm: idle 30s'" }
        - { key: k, desc: "cancel all alarms", icon: "󰂛", color: yellow, cmd: "setw monitor-silence 0 ; setw monitor-activity off ; display 'alarms cleared'" }
        - sep: true
        - { key: Y, desc: "copy pwd", icon: "󰅇", color: yellow, cmd: "run-shell 'zsh ~/.config/zellij/scripts/copy-pwd --relative #{pane_pid}'" }
        - { key: M-y, desc: "copy pwd (abs)", icon: "󰅇", color: yellow, cmd: "run-shell 'zsh ~/.config/zellij/scripts/copy-pwd --absolute #{pane_pid}'" }
        - sep: true
        - { key: U, desc: "glyph picker (repeat)", icon: "󰥸", color: mauve, menu_only: true }
        - { key: G, desc: "gitmoji picker (repeat)", icon: "󰥸", color: mauve, menu_only: true }
        - { key: c, desc: "clipboard history", icon: "󱛢", color: mauve, menu_only: true }
        - sep: true
        - { key: ",", desc: "terminal settings", icon: "", color: teal, cmd: "run-shell 'zsh ~/.config/zellij/scripts/edit-terminal-config'" }
        - { key: q, desc: "kill current session", icon: "󰈆", color: red, menu_only: true }
    tab:
      title: Tab
      icon: "󰓩"
      color: green
      entries:
        - { key: n, desc: "Rename Tab …", icon: "󰑕", color: yellow, menu_only: true }
        - { key: N, desc: "new tab", icon: "󰝜", color: mauve, cmd: "new-window ; set key-table root" }
        - { key: T, desc: "quick launch new tab", icon: "󰓞", color: mauve, menu_only: true }
        - { key: x, desc: "close tab", icon: "󰱞", color: red, cmd: "kill-window ; set key-table root" }
        - sep: true
        - { key: h, desc: "previous tab", icon: "󰅁", color: teal, cmd: "previous-window" }
        - { key: l, desc: "next tab", icon: "󰅂", color: teal, cmd: "next-window" }
        - { key: Tab, desc: "last focused tab", icon: "󰄹", color: teal, cmd: "last-window" }
        - sep: true
        - { key: "[", desc: "tab to pane at left", icon: "󰮹", color: green, cmd: "join-pane -h -t :-1 ; set key-table root" }
        - { key: "]", desc: "tab to pane at right", icon: "󰮺", color: green, cmd: "join-pane -h -t :+1 ; set key-table root" }
        - { key: P, desc: "pane to tab", icon: "", color: green, cmd: "break-pane ; set key-table root" }
        - { key: s, desc: "sync input all panes", icon: "", color: blue, cmd: "setw synchronize-panes ; set key-table root" }
    pane:
      title: Pane
      icon: ""
      color: blue
      entries:
        - { key: m, desc: "Move Pane …", icon: "󰙕", color: yellow, cmd: "set key-table move" }
        - { key: r, desc: "Resize Pane …", icon: "󰩨", color: mauve, cmd: "set key-table resize" }
        - { key: n, desc: "Rename Pane …", icon: "󰑕", color: yellow, menu_only: true }
        - sep: true
        - { key: h, desc: "focus left", icon: "󰅁", color: teal, cmd: "select-pane -L" }
        - { key: j, desc: "focus down", icon: "󰅀", color: teal, cmd: "select-pane -D" }
        - { key: k, desc: "focus up", icon: "󰅃", color: teal, cmd: "select-pane -U" }
        - { key: l, desc: "focus right", icon: "󰅂", color: teal, cmd: "select-pane -R" }
        - sep: true
        - { key: H, desc: "split pane left", icon: "", color: mauve, cmd: "split-window -hb ; set key-table root" }
        - { key: J, desc: "split pane down", icon: "", color: mauve, cmd: "split-window -v ; set key-table root" }
        - { key: K, desc: "split pane up", icon: "", color: mauve, cmd: "split-window -vb ; set key-table root" }
        - { key: L, desc: "split pane right", icon: "", color: mauve, cmd: "split-window -h ; set key-table root" }
        - { key: N, desc: "new pane", icon: "󰯌", color: green, cmd: "split-window ; set key-table root" }
        - { key: P, desc: "quick launch new pane", icon: "󰓞", color: green, menu_only: true }
        - sep: true
        - { key: z, desc: "toggle pane zoom", icon: "󱀅", color: blue, cmd: "resize-pane -Z ; set key-table root" }
        - { key: x, desc: "close pane", icon: "󰅘", color: red, cmd: "kill-pane ; set key-table root" }
    resize:
      title: Resize
      icon: "󰩨"
      color: mauve
      entries:
        - { key: h, desc: "grow left", icon: "󰅁", color: teal, cmd: "resize-pane -L 2" }
        - { key: j, desc: "grow down", icon: "󰅀", color: teal, cmd: "resize-pane -D 2" }
        - { key: k, desc: "grow up", icon: "󰅃", color: teal, cmd: "resize-pane -U 2" }
        - { key: l, desc: "grow right", icon: "󰅂", color: teal, cmd: "resize-pane -R 2" }
        - sep: true
        - { key: "+", desc: "grow", icon: "󰐕", color: teal, cmd: "resize-pane -U 2" }
        - { key: "-", desc: "shrink", icon: "󰍴", color: teal, cmd: "resize-pane -D 2" }
    move:
      title: Move
      icon: "󰙕"
      color: yellow
      entries:
        - { key: j, desc: "swap pane down", icon: "󰅀", color: teal, cmd: "swap-pane -D" }
        - { key: k, desc: "swap pane up", icon: "󰅃", color: teal, cmd: "swap-pane -U" }
        - { key: h, desc: "rotate window up", icon: "󰅁", color: teal, cmd: "rotate-window -U" }
        - { key: l, desc: "rotate window down", icon: "󰅂", color: teal, cmd: "rotate-window -D" }
    session:
      title: Session
      icon: "󰙀"
      color: red
      entries:
        - { key: d, desc: "detach", icon: "󱟃", color: red, cmd: "detach-client" }
        - { key: w, desc: "session manager", icon: "󰧨", color: red, cmd: "choose-tree -Zs ; set key-table root" }
        - { key: S, desc: "quick launch session", icon: "󰓟", color: red, menu_only: true }
    copy:
      title: Scroll
      icon: "󰩤"
      color: lavender
      table: copy-mode-vi
      entries:
        - { key: "/", desc: "Search scroll buffer …", icon: "", color: blue, menu_only: true }
        - { key: V, desc: "edit scrollback", icon: "", color: peach, menu_only: true }
        - { key: v, desc: "copy mode / select", icon: "󰆏", color: mauve, menu_only: true }
        - { key: y, desc: "yank selection", icon: "󰆏", color: yellow, cmd: "send -X copy-pipe-and-cancel" }
        - sep: true
        - { key: n, desc: "next match / prompt", icon: "", color: mauve, menu_only: true }
        - { key: N, desc: "previous match / prompt", icon: "", color: mauve, menu_only: true }
        - { key: M-c, desc: "toggle case sensitive", icon: "", color: yellow, menu_only: true }
        - { key: M-b, desc: "toggle word boundaries", icon: "", color: yellow, menu_only: true }
        - { key: M-p, desc: "toggle line wrap", icon: "󰕇", color: yellow, menu_only: true }
        - sep: true
        - { key: u, desc: "half page up", icon: "󰄿", color: teal, cmd: "send -X halfpage-up" }
        - { key: d, desc: "half page down", icon: "󰄼", color: teal, cmd: "send -X halfpage-down" }
        - { key: g, desc: "scroll to top", icon: "󱥩", color: teal, cmd: "send -X history-top" }
        - { key: G, desc: "scroll to bottom", icon: "󱥧", color: teal, cmd: "send -X history-bottom" }
