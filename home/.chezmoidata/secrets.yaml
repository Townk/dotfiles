# Secrets manifest — the single declarative source of truth for which secret
# env vars exist, what they are for, and which profiles need them.
#
# This file is COMMITTED and world-readable. It carries env var NAMES and
# human-readable prompts ONLY — never values, never company information.
# Actual material lives encrypted (SOPS+age, headless) or in 1Password
# (cached locally after an explicit `op read`, human machines); see the README
# "Secrets" section.
#
# `system-secrets` and `system-onboard` read this manifest to decide which
# secrets to prompt for on a given machine (filtered by `requiredFor`).
#
# Schema (per entry):
#   name        env var name exported into the shell (UPPER_SNAKE_CASE)
#   prompt      one-line description shown when collecting the value
#   requiredFor list of profiles that need this secret: personal|work|dev-shell
secrets:
  - name: MISE_GITHUB_TOKEN
    prompt: GitHub token for mise package metadata
    requiredFor: [personal, work, dev-shell]
  - name: HOMEBREW_GITHUB_API_TOKEN
    prompt: GitHub token for Homebrew API access
    requiredFor: [personal, work]
  - name: GH_TOKEN
    prompt: GitHub token for private repo automation
    requiredFor: [dev-shell]
  - name: OPENCODE_GO_API_KEY
    prompt: OpenCode Go API key
    requiredFor: [personal]
  - name: OPENROUTER_API_KEY
    prompt: OpenRouter API key
    requiredFor: [personal]
  - name: CONTEXT7_API_KEY
    prompt: Context7 API key
    requiredFor: [personal, work, dev-shell]
  - name: BACKUP_REPO_PASSPHRASE
    prompt: Encryption password for config backup
    requiredFor: [personal, work]
