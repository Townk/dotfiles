# Secrets manifest — the single declarative source of truth for which secret
# env vars exist, what they are for, and which profiles need them.
#
# This file is COMMITTED and world-readable. It carries env var NAMES and
# human-readable prompts ONLY — never values, never company information.
# Actual material lives encrypted (SOPS+age, headless) or in 1Password
# (cached locally after an explicit `op read`, human machines); see the README
# "Secrets" section.
#
# `system-secrets` and `system-onboard` read this manifest to decide which
# secrets to prompt for on a given machine (filtered by `requiredFor`).
#
# Schema (per entry):
#   name        env var name exported into the shell (UPPER_SNAKE_CASE)
#   prompt      one-line description shown when collecting the value
#   requiredFor list of profiles that need this secret: personal|work|dev-shell|server
secrets:
  - name: MISE_GITHUB_TOKEN
    prompt: GitHub token for mise package metadata
    requiredFor: [personal, work, dev-shell, server]
    rotated: 1786759913
  - name: HOMEBREW_GITHUB_API_TOKEN
    prompt: GitHub token for Homebrew API access
    requiredFor: [personal, work]
    rotated: 1786760173
  - name: OPENCODE_GO_API_KEY
    prompt: OpenCode Go API key
    requiredFor: [personal]
  - name: OPENROUTER_API_KEY
    prompt: OpenRouter API key
    requiredFor: [personal]
  - name: CONTEXT7_API_KEY
    prompt: Context7 API key
    requiredFor: [personal, work, dev-shell, server]
  - name: BACKUP_REPO_PASSPHRASE
    prompt: Encryption password for config backup
    requiredFor: [personal, work]
  - name: ATLASSIAN_API_TOKEN
    prompt: Auth token used to access Atlassian tools with acli
    requiredFor:
      - work
      - dev-shell
  - name: UNIFI_API_TOKEN
    prompt: Authentication token used to modify UniFi network configuration
    requiredFor:
      - personal
  - name: TAILSCALE_API_TOKEN
    prompt: Client secret for full control of personal TailScale
    requiredFor:
      - personal
  - name: FLEET_AWS_ACCESS_KEY_ID
    prompt: ID for the IAM Access Key to manage rapinialves.com DNS records
    requiredFor:
      - personal
  - name: FLEET_AWS_SECRET_ACCESS_KEY
    prompt: Secret for the IAM Access Key to manage rapinialves.com DNS records
    requiredFor:
      - personal
  - name: FLEET_IAC_ACCESS_KEY_ID
    prompt: ID for the AWS access key for the fleet repo
    requiredFor:
      - personal
  - name: FLEET_IAC_SECRET_ACCESS_KEY
    prompt: Secret for the AWS access key for the fleet repo
    requiredFor:
      - personal
  - name: HA_BACKUP_TOKEN
    prompt: Home Automation access token for fleet-backup
    requiredFor:
      - personal
  - name: HA_PANEL_TOKEN
    prompt: Home Assitant Access Token for the dashboard display data collector
    requiredFor:
      - personal
  - name: EUFY_RTSP_PASSWORD
    prompt: RTSP Stream PWD for Kid's eufy e30 cam
    requiredFor:
      - personal
  # Atuin homelab sync (spec: docs/superpowers/specs/2026-08-17-atuin-homelab-sync-design.md).
  # ATUIN_SYNC_ADDRESS is atuin's own env override — its VALUE names a real
  # homelab host, which is exactly why it lives here and never in a template.
  # The HOMELAB_* trio deliberately avoids the ATUIN_ prefix so they can
  # never collide with atuin's env->config namespace.
  - name: ATUIN_SYNC_ADDRESS
    prompt: Atuin sync server URL for this machine (homelab)
    requiredFor: [personal, work]
  - name: HOMELAB_ATUIN_USERNAME
    prompt: Atuin homelab account username
    requiredFor: [personal, work]
  - name: HOMELAB_ATUIN_PASSWORD
    prompt: Atuin homelab account password
    requiredFor: [personal, work]
  - name: HOMELAB_ATUIN_KEY
    prompt: Atuin E2E key (atuin key --base64; identical on every machine)
    requiredFor: [personal, work]
  - name: TMDB_API_KEY
    prompt: Access to the The Movies Database system
    requiredFor:
      - personal
  - name: LASTFM_API_KEY
    prompt: Last.fm API key for the Navidrome Home Server
    requiredFor:
      - personal
  - name: LASTFM_API_SECRET
    prompt: Last.fm API Secret for the Navidrome Home Server
    requiredFor:
      - personal
  - name: FLEET_SMB_PASSWORD
    prompt: PWD for the media files mounting point
    requiredFor:
      - personal
