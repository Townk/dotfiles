# Which multiplexer .zshrc autostarts for interactive shells (mux migration
# spec §2 "Backend selection", D17).
#
# This is the *outside a session* default only. Inside a session the shim
# never consults it — mux::backend detects tmux/Rex from $TMUX/$REX_SESSION
# at runtime, so a tmux session and a Rex session work side by side on the
# same machine.
#
# "tmux" is the only accepted value since zellij support was removed
# (2026-11-27). The per-machine override ~/.config/mux/backend (loose,
# untracked, mirrors the theme-override pattern) is still read and wins over
# this baked default; an unrecognised value in either place is ignored.
#
# Keep in sync with mux::default_backend's fallback in
# home/dot_local/lib/mux-bootstrap.zsh — tests/mux_autostart_spec.sh pins the
# two together.
muxBackend: tmux

# Per-process tab icons — the tmux half of zj-hud's icons::process_icon
# (src/shared/icons.rs). The pill shows the icon for the window's foreground
# command; anything unlisted falls back to the generic run glyph, exactly as
# the plugin's `unwrap_or_else(tab_process)` does.
#
# Keys are matched against the pill's normalised command — @win_proc when the
# shell has stamped one, else #{pane_current_command} — so they are process
# BASENAMES. node keeps an entry of its own: a node-based CLI that is NOT in
# muxHiddenProcs below still reports the interpreter.
#
# Shells are deliberately absent even though icons.rs lists bash/zsh/fish:
# the plugin's compose_body returns before process_icon for anything is_shell
# says is a shell, so those three entries can never render. The pill's own
# shell branch (win_body in the theme) shows the cwd for is_shell's four
# names instead — bash, zsh, fish, nu.
#
# Ported 1:1 from the plugin so both bars speak the same glyph vocabulary;
# Phase 8 is where the two stop being separate lists.
muxTabIcons:
  agent: "\U0010FB00"
  cursor-agent: "\U0010FB00"
  claude: "\U0010E861"
  pi: "\U0010FB02"
  pi-coding-agent: "\U0010FB02"
  nvim: ""
  vim: ""
  git: ""
  gh: ""
  lazygit: ""
  docker: ""
  docker-compose: ""
  kubectl: ""
  kuberlr: ""
  lazydocker: ""
  node: ""
  go: ""
  cargo: ""
  lua: ""
  ruby: ""
  make: ""
  brew: "\U000F007B"
  pacman: "\U000F0BAF"
  paru: "\U000F0BAF"
  htop: "\U000F0531"
  btop: "\U000F0531"
  psql: ""
  curl: ""
  wget: ""
  sudo: "\U0000F292"

# The glyph for a command with no entry above — zj-hud's
# `unwrap_or_else(tab_process)`. Named rather than written into each consumer,
# because a "generic process" glyph that differs between the tmux pill and the
# pinentry dialog is a difference nobody would ever think to look for.
muxTabIconDefault: "\U000F070E"

# The AI coding agents this repo knows about, as process BASENAMES.
#
# One list, several consumers, because a name missing from any one of them
# fails silently and differently: the tmux `is_agent` probe routes C-j/C-k the
# wrong way, and pinentry-mux decides an agent pane is a human and parks the
# passphrase prompt on a tty nobody is watching. Both used to carry their own
# hand-written `(cursor-)?agent` regex, which matched two of the five.
#
# Consumers (all GENERATED from this list — never hand-edit the copies):
#   - dot_config/tmux/keymap-base.conf.tmpl  `is_agent` ps/grep probe
#   - dot_config/mux/agent-procs.data.tmpl   read at runtime by pinentry-ui,
#     which is spawned by gpg-agent and cannot read chezmoi data
#
# The `(\.exe)?` suffix tolerance lives in those two regexes rather than here:
# it is a spelling of these names, not another name. claude-code renamed its
# binary to claude.exe in an update, so a vendor's platform suffix must never
# decide whether a key routes or a prompt is visible.
#
# muxHiddenProcs below happens to hold the same five today, but it answers a
# different question ("which commands can tmux not name?") and a non-agent
# node CLI could join it tomorrow. Kept separate on purpose.
muxAgentProcs:
  - agent
  - cursor-agent
  - claude
  - pi
  - pi-coding-agent

# Commands tmux cannot name, so the shell names them for it.
#
# #{pane_current_command} is not "the command you ran": tmux picks a process
# out of the pane's foreground process GROUP, and on macOS that is not the
# group leader. Measured 2026-07-29 on an `agent` pane — leader
# ~/.local/bin/agent, five node/npm children sharing its pgid — tmux reported
# "node", so the pill drew node's hexagon instead of the Cursor cube. zj-hud
# never had to guess: zellij hands it the pane's running command
# (get_pane_running_command / Event::CommandChanged).
#
# functions.d/mux-tab-proc.sh stamps these onto the pane as @win_proc in
# preexec and drops it again in precmd; the pill prefers @win_proc over
# #{pane_current_command} (win_cmd, declared in both tmux.conf and the theme).
# Only the commands listed here are stamped: a `tmux set` round-trip costs
# ~10ms (measured), worth paying once when a long-running agent starts and not
# on every command tmux already names correctly.
muxHiddenProcs:
  - agent
  - cursor-agent
  - claude
  - pi
  - pi-coding-agent

# Where the Rex Mac app keeps its CLI, relative to $HOME. The app puts `rex`
# on PATH only in the panes it starts, so everything that runs elsewhere (an
# apply hook, a launchd job, the server's own `rex.exec`) falls back to this
# path. Feeds the templates: .chezmoitemplates/rex-bin.sh.tmpl (hooks 59-61)
# and dot_config/rex/init.lua.tmpl. The zsh libs are not templates and carry
# the same string as a literal — dot_local/lib/mux/rex.zsh (_mux_rx_bin) and
# dot_local/lib/job/rex.zsh (job::_rex); tests/mux_rex_helpers_spec.sh pins
# them to this value.
rexAppCli: "Library/Application Support/com.superlogical.rex/RexServer/Versions/Current/Rex Server.app/Contents/MacOS/rex"

# Rex app settings. The Rex app keeps its settings (fonts, pane chrome) in its
# own preferences, not in a file, so they are listed here and pushed by the
# `settings_apply` action in ~/.config/rex/init.lua: `chezmoi apply` runs it on
# this machine's connected Mac app whenever this list changes, and "Apply
# Settings from Dotfiles" in the command palette runs it by hand (needed once
# on a new machine, and on any app that connected later).
#
# Each entry is a `client.setting.*` action and its value; `rex -C <app>
# actions` lists them, and an action refuses a value it does not know with the
# list of the ones it does. A setting changed in the app and not here is put
# back at the next apply — change it here.
rexSettings:
  - {action: client.setting.terminal.typography.font, value: JetBrains Mono}
  - {action: client.setting.terminal.typography.style, value: SemiBold}
  - {action: client.setting.terminal.typography.size, value: 19}
  - {action: client.setting.terminal.typography.line_height, value: 15}
  # The custom-built symbols font first: Rex bundles its own "Symbols Nerd
  # Font", and only the Mono family name reaches ours.
  - {action: client.setting.terminal.advanced_fonts.fallback_fonts, value: "Symbols Nerd Font Mono, Apple Color Emoji, Menlo"}
  - {action: client.setting.terminal.advanced_fonts.ligatures, value: true}
  - {action: client.setting.interface.panes.headers, value: hidden}
  - {action: client.setting.interface.panes.density, value: comfortable}
  - {action: client.setting.interface.active_panes.fade, value: both}
