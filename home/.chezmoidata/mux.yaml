# Which multiplexer .zshrc autostarts for interactive shells (mux migration
# spec §2 "Backend selection", D17).
#
# This is the *outside a session* default only. Inside a session the shim
# never consults it — mux::backend detects tmux/zellij from $TMUX/$ZELLIJ at
# runtime, so a tmux session and a Zellij session work side by side on the
# same machine.
#
# Per-machine override: write "tmux" or "zellij" into ~/.config/mux/backend
# (loose, untracked, mirrors the theme-override pattern). It wins over this
# baked default, so a single box can dissent without a chezmoi edit.
#
# Keep in sync with mux::default_backend's fallback in
# home/dot_local/lib/mux.zsh — tests/mux_autostart_spec.sh pins the two together.
muxBackend: tmux

# Per-process tab icons — the tmux half of zj-hud's icons::process_icon
# (src/shared/icons.rs). The pill shows the icon for the window's foreground
# command; anything unlisted falls back to the generic run glyph, exactly as
# the plugin's `unwrap_or_else(tab_process)` does.
#
# Keys are matched against the pill's normalised command — @win_proc when the
# shell has stamped one, else #{pane_current_command} — so they are process
# BASENAMES. node keeps an entry of its own: a node-based CLI that is NOT in
# muxHiddenProcs below still reports the interpreter.
#
# Shells are deliberately absent even though icons.rs lists bash/zsh/fish:
# the plugin's compose_body returns before process_icon for anything is_shell
# says is a shell, so those three entries can never render. The pill's own
# shell branch (win_body in the theme) shows the cwd for is_shell's four
# names instead — bash, zsh, fish, nu.
#
# Ported 1:1 from the plugin so both bars speak the same glyph vocabulary;
# Phase 8 is where the two stop being separate lists.
muxTabIcons:
  agent: "\U0010FB00"
  cursor-agent: "\U0010FB00"
  claude: "\U0010E861"
  pi: "\U0010FB02"
  pi-coding-agent: "\U0010FB02"
  nvim: ""
  vim: ""
  git: ""
  gh: ""
  lazygit: ""
  docker: ""
  docker-compose: ""
  kubectl: ""
  kuberlr: ""
  lazydocker: ""
  node: ""
  go: ""
  cargo: ""
  lua: ""
  ruby: ""
  make: ""
  brew: "\U000F007B"
  pacman: "\U000F0BAF"
  paru: "\U000F0BAF"
  htop: "\U000F0531"
  btop: "\U000F0531"
  psql: ""
  curl: ""
  wget: ""
  sudo: "\U0000F292"

# Commands tmux cannot name, so the shell names them for it.
#
# #{pane_current_command} is not "the command you ran": tmux picks a process
# out of the pane's foreground process GROUP, and on macOS that is not the
# group leader. Measured 2026-07-29 on an `agent` pane — leader
# ~/.local/bin/agent, five node/npm children sharing its pgid — tmux reported
# "node", so the pill drew node's hexagon instead of the Cursor cube. zj-hud
# never had to guess: zellij hands it the pane's running command
# (get_pane_running_command / Event::CommandChanged).
#
# functions.d/mux-tab-proc.sh stamps these onto the pane as @win_proc in
# preexec and drops it again in precmd; the pill prefers @win_proc over
# #{pane_current_command} (win_cmd, declared in both tmux.conf and the theme).
# Only the commands listed here are stamped: a `tmux set` round-trip costs
# ~10ms (measured), worth paying once when a long-running agent starts and not
# on every command tmux already names correctly.
muxHiddenProcs:
  - agent
  - cursor-agent
  - claude
  - pi
  - pi-coding-agent
